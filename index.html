<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Sanskriti</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            background-color: #fce4ec; 
            overflow: hidden;
            touch-action: none; 
        }

        #master-lock-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #fdf2f5; z-index: 20000; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            transition: all 0.8s cubic-bezier(0.65, 0, 0.35, 1);
        }

        #error-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.2); z-index: 30000; display: none;
            justify-content: center; align-items: center;
        }

        .error-popup {
            background: white; padding: 25px; border-radius: 15px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 280px; border: 2px solid #ff4d6d;
        }

        .lock-icon { font-size: 80px; margin-bottom: 20px; transition: transform 1s ease; }
        
        .lock-input-box {
            background: rgba(255, 240, 245, 0.9); padding: 30px; border-radius: 20px;
            backdrop-filter: blur(10px); text-align: center; width: 85%; max-width: 320px;
            border: 1px solid rgba(255, 182, 193, 0.5);
        }

        .slider-container { display: flex; width: 400vw; height: 100vh; transition: transform 0.8s cubic-bezier(0.65, 0, 0.35, 1); }
        .slide { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #fdf2f5 0%, #fce4ec 100%); }

        .glass-card {
            background: rgba(255, 245, 247, 0.9); backdrop-filter: blur(15px);
            border-radius: 25px; padding: 40px 20px; text-align: center;
            width: 90%; max-width: 350px; box-shadow: 0 8px 32px rgba(255, 182, 193, 0.3);
            border: 1.5px solid rgba(255, 255, 255, 0.8);
        }

        /* PHOTO HANGING STYLE FOR LAST PAGE */
        .photo-gallery {
            display: flex; justify-content: space-around; width: 100%;
            height: 250px; margin-top: 20px;
        }

        .hanging-photo {
            width: 90px; height: 120px; background: white;
            border: 4px solid white; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            position: relative; transition: transform 0.3s ease;
        }

        /* The "string" or line holding the photo */
        .hanging-photo::before {
            content: ''; position: absolute; top: -60px; left: 50%;
            width: 2px; height: 60px; background: #ff4d6d; transform: translateX(-50%);
        }

        .hanging-photo img { width: 100%; height: 100%; object-fit: cover; }

        /* Different heights for the 3 photos to match your drawing */
        .p1 { transform: rotate(-5deg); margin-top: 40px; }
        .p2 { transform: rotate(3deg); margin-top: 20px; }
        .p3 { transform: rotate(-2deg); margin-top: 50px; }

        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fdf2f5;
            display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 10000;
        }

        .loader-card { width: 85%; max-width: 320px; padding: 40px 20px; background: white; border-radius: 25px; text-align: center; }
        .progress-bar { width: 0%; height: 100%; background: #ff4d6d; border-radius: 20px; transition: width 0.2s ease; }
        
        button { padding: 12px 35px; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; background: #ff4d6d; color: white; margin-top: 10px; }
        #noBtn { background-color: #444; position: absolute; z-index: 999; }
        
        input[type="text"] { padding: 12px; border-radius: 10px; border: 1.5px solid #ffcad4; width: 85%; margin-bottom: 15px; text-align: center; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="error-overlay">
        <div class="error-popup">
            <div style="font-size: 40px;">⚠️</div>
            <div style="color: #333; font-weight: bold; margin: 15px 0;">Invalid Name! 😤</div>
            <button onclick="hideError()" style="width: 100%;">Try Again</button>
        </div>
    </div>

    <div id="master-lock-screen">
        <div class="lock-icon" id="mainLockEmoji">🔒</div>
        <div class="lock-input-box" id="lockBox">
            <p style="margin-bottom:15px; font-weight:bold; color:#444;">Type your boyfriend name 😤</p>
            <input type="text" id="bfNameInput" placeholder="Enter name...">
            <button onclick="unlockMaster()" style="width:100%;">Unlock</button>
        </div>
    </div>

    <div id="loading-overlay">
        <div class="loader-card">
            <div style="position:relative">
                <span id="loadPercent" style="position: absolute; right: 0; top: -22px; font-size: 13px; font-weight: bold; color: #ff4d6d;">0%</span>
                <div style="width: 100%; height: 14px; background: #eee; border-radius: 20px;">
                    <div class="progress-bar" id="loadBar"></div>
                </div>
            </div>
            <div style="margin-top:20px; font-weight:bold; color:#ff4d6d;">LOADING...</div>
        </div>
    </div>

    <div class="slider-container" id="mainSlider">
        <section class="slide">
            <div class="glass-card" id="loveCard">
                <div style="font-size:50px">🐱 ❤️</div>
                <h2 style="color: #ff4d6d;">Sanskriti</h2>
                <h1>Do you love me!?</h1>
                <div style="position: relative; height: 130px; margin-top: 20px;">
                    <button onclick="triggerLoading()">Yes 💖</button>
                    <button id="noBtn" style="top:70px; left: 50%; transform: translateX(-50%);">No 🙈</button>
                </div>
            </div>
        </section>

        <section class="slide">
            <div class="glass-card">
                <h1 style="color: #ff4d6d;">You're special! ✨</h1>
                <p style="color: #555;">Tumhari hansi meri sabse badi khushi hai. ❤️</p>
                <button onclick="nextSlide(2)">Next ➔</button>
            </div>
        </section>

        <section class="slide">
            <div class="glass-card">
                <h1 style="color: #ff4d6d;">A promise... 🌸</h1>
                <p style="color: #555;">Main humesha tumhare saath rahunga.</p>
                <button onclick="nextSlide(3)">See Something 💌</button>
            </div>
        </section>

        <section class="slide">
            <div class="glass-card" style="max-width: 380px;">
                <h2 style="color: #ff4d6d; margin-bottom: 20px;">For Us ❤️</h2>
                
                <div class="photo-gallery">
                    <div class="hanging-photo p1">
                        <img src="https://i.ibb.co/dsgWSTqJ/1000092455.jpg" alt="Pic 1">
                    </div>
                    <div class="hanging-photo p2">
                        <img src="https://i.ibb.co/PqRKmCr/1.jpg" alt="Pic 2">
                    </div>
                    <div class="hanging-photo p3">
                        <img src="https://i.ibb.co/qFsNdC38/2.jpg" alt="Pic 3">
                    </div>
                </div>

                <p style="color: #ff4d6d; font-weight: bold; margin-top: 60px;">Every moment with you is a treasure. ✨</p>
            </div>
        </section>
    </div>

    <script>
        const slider = document.getElementById('mainSlider');
        const bar = document.getElementById('loadBar');
        const pct = document.getElementById('loadPercent');
        const overlay = document.getElementById('loading-overlay');
        const noBtn = document.getElementById('noBtn');

        function unlockMaster() {
            if(document.getElementById('bfNameInput').value.trim().toLowerCase() === "anurag") {
                document.getElementById('mainLockEmoji').innerText = "🔓";
                setTimeout(() => {
                    document.getElementById('master-lock-screen').style.transform = 'translateY(-100%)';
                }, 500);
            } else { document.getElementById('error-overlay').style.display = 'flex'; }
        }

        function hideError() { document.getElementById('error-overlay').style.display = 'none'; }

        async function triggerLoading() {
            overlay.style.display = 'flex';
            for(let i=0; i<=100; i++) {
                bar.style.width = i + "%";
                pct.innerText = i + "%";
                await new Promise(r => setTimeout(r, 20));
            }
            nextSlide(1);
            overlay.style.display = 'none';
        }

        function nextSlide(idx) { slider.style.transform = `translateX(-${idx * 100}vw)`; }

        noBtn.addEventListener('mouseover', () => {
            noBtn.style.left = Math.random() * (window.innerWidth - 100) + 'px';
            noBtn.style.top = Math.random() * (window.innerHeight - 100) + 'px';
        });
    </script>
</body>
</html>

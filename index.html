<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Sanskriti</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            background-color: #ffcad4;
            overflow: hidden;
            touch-action: none; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .slider-container {
            display: flex;
            width: 400vw;
            height: 100vh;
            transition: transform 0.6s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .slide {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: radial-gradient(circle, #ffdee9 0%, #ffcad4 100%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(255, 105, 135, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            width: 90%;
            max-width: 350px;
            z-index: 10;
        }

        .emoji-header { font-size: 50px; margin-bottom: 10px; }
        h2 { font-weight: 500; color: #444; margin-bottom: 5px; }
        h1 { font-size: 24px; margin-bottom: 30px; color: #222; }

        .btn-wrapper {
            position: relative;
            height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        button {
            padding: 12px 35px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        #yesBtn { background-color: #ff4d6d; color: white; }

        #noBtn { 
            background-color: #222; 
            color: #ff4d6d; 
            position: absolute;
            top: 75px; 
            transition: 0.1s ease-out;
            z-index: 999;
            white-space: nowrap;
        }

        .footer-text { font-size: 11px; color: #888; margin-top: 25px; font-style: italic; }

        /* Rain & Letter */
        .hidden { display: none; }
        .paper { background: #fff; padding: 20px; border-radius: 10px; text-align: left; margin-top: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .heart-drop { position: absolute; top: -20px; color: #ff4d6d; font-size: 22px; pointer-events: none; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
        input[type="text"] { padding: 12px; border-radius: 10px; border: 1px solid #ffcad4; width: 80%; margin-bottom: 10px; outline: none; }

        /* REAL LOADING BAR STYLE (from your image) */
        #loadingWrapper {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 280px;
            text-align: center;
            z-index: 100;
        }

        #loadingLabel {
            font-weight: bold;
            color: #ff4d6d;
            font-size: 16px;
            margin-bottom: 8px;
        }

        #loadingContainer {
            width: 100%;
            height: 15px;
            background-color: #333;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.2);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        #loadingBar {
            height: 100%;
            width: 0%;
            background-color: #ff4d6d;
            border-radius: 15px;
            transition: width 0.1s linear; /* Smooth progress update */
        }
    </style>
</head>
<body>

    <div id="loadingWrapper">
        <div id="loadingLabel">LOADING... <span id="percentText">0%</span></div>
        <div id="loadingContainer">
            <div id="loadingBar"></div>
        </div>
    </div>

    <div class="slider-container" id="mainSlider">
        <section class="slide" id="slide1">
            <div class="glass-card" id="card1">
                <div class="emoji-header">🐱 ❤️</div>
                <h2>Sanskriti</h2>
                <h1>Do you love me!?</h1>
                <div class="btn-wrapper">
                    <button id="yesBtn" onclick="handleYes()">Yes 💖</button>
                    <button id="noBtn">No 🙈</button>
                </div>
                <p class="footer-text">Some love stories don't allow "no" 😤</p>
            </div>
        </section>

        <section class="slide">
            <div class="glass-card">
                <h1>You're special! ✨</h1>
                <p>Tumhari hansi meri sabse badi khushi hai. ❤️</p>
                <button onclick="nextSlide(2)" style="background:#ff4d6d;color:white;margin-top:20px">Next ➔</button>
            </div>
        </section>

        <section class="slide">
            <div class="glass-card">
                <h1>A promise... 🌸</h1>
                <p>Main humesha tumhare saath rahunga.</p>
                <button onclick="nextSlide(3)" style="background:#ff4d6d;color:white;margin-top:20px">Read Letter 💌</button>
            </div>
        </section>

        <section class="slide">
            <div id="rainContainer"></div>
            <div class="glass-card">
                <div id="lockSection">
                    <h1>A Private Letter 💌</h1>
                    <p>Type <b>10ml</b> to unlock</p><br>
                    <input type="text" id="passcode" placeholder="Enter code">
                    <button onclick="checkCode()" style="background:#ff4d6d;color:white">Open</button>
                </div>
                <div id="letterContent" class="hidden">
                    <div class="paper">
                        <h3 style="color:#ff4d6d">Dear Sanskriti,</h3>
                        <p>Yahan apna letter likhein...</p>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const slider = document.getElementById('mainSlider');
        const card1 = document.getElementById('card1');
        const loadingWrapper = document.getElementById('loadingWrapper');
        const loadingBar = document.getElementById('loadingBar');
        const percentText = document.getElementById('percentText');

        // NO BUTTON JUMP LOGIC
        const moveNoButton = (e) => {
            if(e.type === 'touchstart') e.preventDefault();
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;
            const padding = 50;
            const maxX = window.innerWidth - btnWidth - padding;
            const maxY = window.innerHeight - btnHeight - padding;
            let randomX = Math.floor(Math.random() * (maxX - padding)) + padding;
            let randomY = Math.floor(Math.random() * (maxY - padding)) + padding;
            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
            noBtn.style.margin = '0';
        };

        noBtn.addEventListener('mouseover', moveNoButton);
        noBtn.addEventListener('touchstart', moveNoButton);

        // YES BUTTON CUSTOM LOGIC (Hide -> Load -> Slide)
        function handleYes() {
            // 1. Hide card instantly
            card1.style.display = 'none';
            noBtn.style.display = 'none';

            // 2. Show Loader
            loadingWrapper.style.display = 'block';
            
            // 3. Start progress animation
            let progress = 0;
            const loadingInterval = setInterval(() => {
                progress += Math.random() * 8; // Random incremental steps for natural look
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(loadingInterval);
                    
                    // Finish up and slide
                    setTimeout(() => {
                        loadingWrapper.style.display = 'none';
                        nextSlide(1); // Go to Page 2
                    }, 500); // Small pause at 100%
                }
                
                loadingBar.style.width = progress + '%';
                percentText.innerText = Math.round(progress) + '%';
            }, 100); // Update every 100ms
        }

        function nextSlide(idx) {
            slider.style.transform = `translateX(-${idx * 100}vw)`;
            if(idx > 0) noBtn.style.display = 'none';
            if(idx === 3) startHeartRain();
        }

        function checkCode() {
            if(document.getElementById('passcode').value === "10ml") {
                document.getElementById('lockSection').classList.add('hidden');
                document.getElementById('letterContent').classList.remove('hidden');
            } else { alert("Hint: 10ml"); }
        }

        function startHeartRain() {
            const container = document.getElementById('rainContainer');
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('heart-drop');
                heart.innerHTML = '💗';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 2 + 2) + 's';
                container.appendChild(heart);
                setTimeout(() => heart.remove(), 4000);
            }, 300);
        }
    </script>
</body>
</html>

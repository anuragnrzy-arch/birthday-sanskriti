<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Sanskriti</title>
    <style>
        /* Core Styling */
        * { 
            margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            user-select: none;
        }
        body { background-color: #fce4ec; overflow: hidden; touch-action: none; }
        
        /* Spotify Player Styling */
        #sp-overlay { display: none; position: fixed; inset: 0; z-index: 50000; align-items: center; justify-content: center; }
        #sp-overlay.sp-on { display: flex; }
        .sp-card { position:relative; z-index:10; width:330px; background:rgba(14,5,10,0.82); backdrop-filter:blur(30px); border-radius:26px; padding:22px 20px 26px; color: white; text-align: center; }
        .sp-title { font-size:1.18rem; font-weight:700; margin-bottom:2px; }
        .sp-artist { font-size:0.78rem; color:rgba(255,255,255,0.48); margin-bottom:13px; }
        
        /* Layout & Animations */
        .slider-container { display: flex; width: 600vw; height: 100vh; transition: transform 0.8s cubic-bezier(0.65, 0, 0.35, 1); }
        .slide { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #fdf2f5 0%, #fce4ec 100%); }
        .glass-card { background: rgba(255, 245, 247, 0.9); backdrop-filter: blur(15px); border-radius: 25px; padding: 40px 20px; text-align: center; width: 90%; max-width: 350px; }
        
        /* Letter & Memories */
        .white-paper { background: white; width: 90%; max-width: 350px; border-radius: 15px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 40px; }
        .memory-photo { width: 200px; height: 280px; background: white; padding: 8px; border: 2px solid #ff4d6d; border-radius: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div id="sp-overlay">
        <div class="sp-card">
            <button onclick="spClose()" style="position:absolute; top:10px; right:10px; background:none; color:white; border:none; cursor:pointer;">✕</button>
            <div class="sp-title">10,000 Hours</div>
            <div class="sp-artist">Dan + Shay, Justin Bieber</div>
            <div id="spLyr" style="height:80px; overflow:hidden; margin: 20px 0;">
                <div class="sp-line on">I'd spend 10,000 hours and 10,000 more</div>
                <div class="sp-line">Oh, if that's what it takes to learn that sweet heart of yours</div>
            </div>
        </div>
    </div>

    <div class="slider-container" id="mainSlider">
        <section class="slide">
            <div class="glass-card">
                <div style="font-size:50px">🐱 ❤️</div>
                <h2 style="color: #ff4d6d;">Sanskriti</h2>
                <h1>Do you love me!?</h1>
                <button id="yesBtn" onclick="nextSlide(1)" style="background:#ff4d6d; color:white; padding:10px 30px; border-radius:20px; border:none; margin-top:20px;">Yes 👀</button>
            </div>
        </section>

        <section class="slide">
            <div class="page2-container">
                <h1 style="color:#ff4d6d; font-family:'Brush Script MT'; font-size:34px;">𝓐 𝓛𝓲𝓽𝓽𝓵𝓮 𝓷𝓸𝓽𝓮 𝓯𝓸𝓻 𝔂𝓸𝓾</h1>
                <div class="note-box" onclick="spOpen()" style="cursor:pointer; background:#ffecf2; padding:30px; border-radius:20px; text-align:center;">
                    <div style="font-size:35px; color:#ff4d6d;">🤍</div>
                    <p style="font-weight:bold; color:#ff4d6d;">TAP TO OPEN</p>
                </div>
            </div>
        </section>
    </div>

    <script>
        /* Function to open Spotify */
        function spOpen() {
            document.getElementById('sp-overlay').classList.add('sp-on');
        }
        function spClose() {
            document.getElementById('sp-overlay').classList.remove('sp-on');
        }
        function nextSlide(index) {
            document.getElementById('mainSlider').style.transform = `translateX(-${index * 100}vw)`;
        }
    </script>
</body>
</html>

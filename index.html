<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love ❤️</title>
    <style>
        /* CSS START - Sab styling yahan hai */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #fde2e4; /* Light Pink Background */
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        /* Container jo slides ko move karega */
        .main-container {
            display: flex;
            width: 400vw; /* 4 slides = 400% width */
            height: 100vh;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .slide {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            position: relative;
        }

        img {
            width: 200px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        h1 {
            font-size: 2.2rem;
            color: #333;
            margin-bottom: 5px;
        }

        p {
            color: #777;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            min-height: 50px;
        }

        button {
            padding: 12px 35px;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: 0.2s;
            background: white;
            color: black;
        }

        #noBtn {
            position: absolute;
            z-index: 10;
        }

        /* Slide 4 Special - Heart Rain */
        .heart {
            position: absolute;
            top: -50px;
            font-size: 20px;
            color: #ff4d6d;
            animation: fall linear forwards;
            z-index: 1;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        /* Love Letter / Envelope Styling */
        .envelope-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 5;
        }

        .pass-input {
            padding: 10px;
            border: 2px solid #ffb3c1;
            border-radius: 5px;
            margin-bottom: 10px;
            outline: none;
        }

        .letter-box {
            display: none;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            max-width: 300px;
            transform: scale(0);
            transition: 0.5s;
        }

        .letter-box.open {
            display: block;
            transform: scale(1);
        }

    </style>
</head>
<body>

    <div class="main-container" id="slider">
        
        <section class="slide">
            <img src="https://media.tenor.com/cyX69N7pL6AAAAAj/mochi-cat.gif" alt="Cat">
            <h1>Do you love me!? 🥰</h1>
            <p>Chiku is all yours</p>
            <div class="btn-group">
                <button onclick="goNext()">Yes</button>
                <button id="noBtn">No</button>
            </div>
        </section>

        <section class="slide">
            <img src="https://media.tenor.com/97y469p9684AAAAj/cute-cat.gif" alt="Thinking Cat">
            <h1>Please think again! 🙄</h1>
            <p>itni jaldi na matt bolo 😭</p>
            <div class="btn-group">
                <button onclick="goNext()">Yes</button>
                <button onclick="alert('Sirf Yes dabana allow hai! 😂')">No</button>
            </div>
        </section>

        <section class="slide">
            <img src="https://media.tenor.com/T0_YfVp877AAAAAj/mochi-cat-peach-and-goma.gif" alt="Crying Cat">
            <h1>Baby Man jao na! 😫</h1>
            <p>Kitna bhav khaogi... bhut glt baat hai yrr 😢</p>
            <div class="btn-group">
                <button onclick="goNext()">Yes</button>
            </div>
        </section>

        <section class="slide">
            <div id="rain-zone"></div>
            <h1>I knew it! You Love me a lot 😘</h1>
            
            <div class="envelope-container">
                <div id="lockSection">
                    <input type="text" id="code" class="pass-input" placeholder="Enter code (10ml)">
                    <button onclick="checkCode()">Open Letter 💌</button>
                </div>

                <div id="letter" class="letter-box">
                    <h3 style="color:#ff4d6d">My Love,</h3>
                    <p style="font-size: 0.9rem; color: #333; margin-top: 10px;">
                        You are the best thing that ever happened to me. 
                        Tumhare bina sab adhura hai. ❤️<br><br>
                        <b>Forever Yours!</b>
                    </p>
                </div>
            </div>
        </section>

    </div>

    <script>
        // JAVASCRIPT START - Sab logic yahan hai
        let currentSlide = 0;
        const slider = document.getElementById('slider');
        const noBtn = document.getElementById('noBtn');

        // 1. "No" Button bhagne wala logic (Mobile & Desktop)
        const moveNo = () => {
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        };

        noBtn.addEventListener('mouseenter', moveNo);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevents clicking on mobile
            moveNo();
        });

        // 2. Slide change logic
        function goNext() {
            currentSlide++;
            slider.style.transform = `translateX(-${currentSlide * 100}vw)`;
            
            if(currentSlide === 3) {
                startHeartRain();
            }
        }

        // 3. Heart Rain logic
        function startHeartRain() {
            const rainZone = document.getElementById('rain-zone');
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerHTML = '💗';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
                rainZone.appendChild(heart);
                
                setTimeout(() => heart.remove(), 5000);
            }, 300);
        }

        // 4. Letter Password Logic
        function checkCode() {
            const input = document.getElementById('code').value;
            if(input === '10ml') {
                document.getElementById('lockSection').style.display = 'none';
                const letter = document.getElementById('letter');
                letter.classList.add('open');
            } else {
                alert("Galat code! Hint: wo jo tumne bola tha (10ml) 😉");
            }
        }
    </script>
</body>
</html>

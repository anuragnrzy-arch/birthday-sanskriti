    <button id="yes" onclick="yesClick()">Yes</button>
    <button id="no" onmouseover="moveNo()">No</button>

    <p id="msg"></p>
  </div>

  <script>
    function yesClick() {
      document.getElementById("msg").innerHTML = "Yay! 💕 I knew it!";
    }

    function moveNo() {
      let btn = document.getElementById("no");

      let x = Math.random() * 200;
      let y = Math.random() * 200;

      btn.style.position = "relative";
      btn.style.left = x + "px";
      btn.style.top = y + "px";
    }
  </script>

<div class="hidden" id="game">

</div>

<script>
/* FLOW CONTROL */
function openName() {
    step1.classList.add("hidden");
    step2.classList.remove("hidden");

function neymar() {

}

function anurag() {
    step2.classList.add("hidden");
    step3.classList.remove("hidden");
}

function startGame() {
    step3.classList.add("hidden");
    game.classList.remove("hidden");
    initGame();
}

/* DINO GAME (CHROME STYLE LOGIC) */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let dino = { x: 50, y: 150, w: 40, h: 40, vy: 0, jumping: false };
let obstacle = { x: 600, y: 160, w: 20, h: 40 };
let gravity = 0.8;
let scoreVal = 0;
let gameRunning = false;

function initGame() {
    gameRunning = true;
    scoreVal = 0;
    requestAnimationFrame(loop);
}

function jump() {
    if (!dino.jumping) {
        dino.vy = -14;
        dino.jumping = true;
    }
}

function loop() {
    if (!gameRunning) return;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Dino
    dino.y += dino.vy;
    dino.vy += gravity;

    if (dino.y >= 150) {
        dino.y = 150;
        dino.vy = 0;
        dino.jumping = false;
    }

    ctx.fillStyle = "black";
    ctx.fillRect(dino.x, dino.y, dino.w, dino.h);

    // Obstacle
    obstacle.x -= 6;
    if (obstacle.x < -20) {
        obstacle.x = 600;
        scoreVal++;
        score.innerText = "Score: " + scoreVal;
    }

    ctx.fillRect(obstacle.x, obstacle.y, obstacle.w, obstacle.h);

    // Collision
    if (
        dino.x < obstacle.x + obstacle.w &&
        dino.x + dino.w > obstacle.x &&
        dino.y < obstacle.y + obstacle.h &&
        dino.y + dino.h > obstacle.y
    ) {
        gameRunning = false;
        alert("💀 GAME OVER | Score: " + scoreVal);
        location.reload();
    }

    requestAnimationFrame(loop);
}
</script>

</body>

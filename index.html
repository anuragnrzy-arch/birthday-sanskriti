<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<!-- ✅ MOBILE FIX -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Love Page</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    /* 💖 Soft pink + sky gradient */
    background: linear-gradient(135deg, #ffd6e0, #d6ecff);

    font-family: Arial;
    text-align: center;
}

.container {
    padding: 20px;
}

iframe {
    width: 160px;
    height: 160px;
    border: none;
}

h2 {
    font-size: 22px;
    color: #333;
}

p {
    color: #555;
}

button {
    padding: 10px 18px;
    margin: 10px;
    border: none;
    border-radius: 10px;
    background: white;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    font-size: 16px;
}

#noBtn {
    position: absolute;
}
</style>
</head>

<body>

<div class="container">
    <iframe id="gif" src="https://giphy.com/embed/JIX9t2j0ZTN9S"></iframe>

    <h2 id="text">Do you love me? 🥺</h2>
    <p>Chiku is all yours 💖</p>

    <button onclick="yes()">Yes</button>
    <button id="noBtn" onclick="no()">No</button>
</div>

<script>

let step = 0;

function yes(){
    document.getElementById("gif").src =
    "https://giphy.com/embed/MDJ9IbxxvDUQM";

    document.getElementById("text").innerText =
    "I knew it! You Love me 😘💖";
}

function no(){
    step++;

    if(step == 1){
        document.getElementById("gif").src =
        "https://giphy.com/embed/3oriO0OEd9QIDdllqo";

        document.getElementById("text").innerText =
        "Please think again 🥺";
    }

    else if(step == 2){
        document.getElementById("gif").src =
        "https://giphy.com/embed/l378giAZgxPw3eO52";

        document.getElementById("text").innerText =
        "Baby maan jao na 😭";
    }

    move();
}

function move(){
    let btn = document.getElementById("noBtn");

    let x = Math.random() * (window.innerWidth - 100);
    let y = Math.random() * (window.innerHeight - 50);

    btn.style.left = x + "px";
    btn.style.top = y + "px";
}

</script>

</body>
</html>

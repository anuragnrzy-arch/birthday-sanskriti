<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You 💖</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    text-align: center;
    background: linear-gradient(135deg, #ffd6e0, #d6ecff);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    padding: 20px;
    max-width: 300px;
}

iframe {
    width: 180px;
    height: 180px;
    border: none;
}

h2 {
    color: #333;
}

p {
    color: #555;
    font-size: 14px;
}

button {
    padding: 10px 18px;
    margin-top: 15px;
    border: none;
    border-radius: 10px;
    background: white;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}
</style>
</head>

<body>

<div class="container">
    <iframe id="gif" src="https://giphy.com/embed/JIX9t2j0ZTN9S"></iframe>

    <h2 id="title">Hey… 🥺</h2>
    <p id="text">I want to tell you something...</p>

    <button onclick="next()">Next ➡️</button>
</div>

<script>

let page = 0;

function next(){
    page++;

    if(page == 1){
        document.getElementById("gif").src =
        "https://giphy.com/embed/3oriO0OEd9QIDdllqo";

        document.getElementById("title").innerText =
        "We broke up… 💔";

        document.getElementById("text").innerText =
        "That day was really hard for me… I missed you every single day.";
    }

    else if(page == 2){
        document.getElementById("gif").src =
        "https://giphy.com/embed/l378giAZgxPw3eO52";

        document.getElementById("title").innerText =
        "But we fixed it… 💖";

        document.getElementById("text").innerText =
        "After 1 year… we are back again. And it feels special.";
    }

    else if(page == 3){
        document.getElementById("gif").src =
        "https://giphy.com/embed/MDJ9IbxxvDUQM";

        document.getElementById("title").innerText =
        "May 9 💫";

        document.getElementById("text").innerText =
        "That day means everything to me… I just want to say I love you ❤️";

        document.querySelector("button").innerText = "❤️";
    }
}

</script>

</body>
</html>

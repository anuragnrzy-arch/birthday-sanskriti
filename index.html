<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Sanskriti</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            background-color: #ffcad4;
            overflow: hidden;
            touch-action: none; 
        }

        .slider-container {
            display: flex;
            width: 400vw;
            height: 100vh;
            transition: transform 0.6s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .slide {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: radial-gradient(circle, #ffdee9 0%, #ffcad4 100%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(255, 105, 135, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            width: 90%;
            max-width: 350px;
            z-index: 10;
        }

        /* FULL LOADING OVERLAY */
        #loader-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #ffdee9;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .progress-box {
            width: 80%;
            max-width: 300px;
            height: 12px;
            background: #333;
            border-radius: 10px;
            overflow: visible; /* Heart bahar dikhne ke liye */
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #ff4d6d;
            border-radius: 10px;
            transition: width 0.3s ease;
            position: relative;
        }

        .loading-heart {
            position: absolute;
            right: -10px;
            top: -25px;
            font-size: 20px;
        }

        .loading-text {
            margin-top: 25px;
            font-weight: bold;
            color: #444;
            letter-spacing: 2px;
            font-size: 14px;
        }

        .percent-display {
            position: absolute;
            right: 0;
            top: -22px;
            font-size: 12px;
            color: #333;
            font-weight: bold;
        }

        /* UI Elements */
        .emoji-header { font-size: 50px; margin-bottom: 10px; }
        h2 { font-weight: 500; color: #444; margin-bottom: 5px; }
        h1 { font-size: 24px; margin-bottom: 30px; color: #222; }

        .btn-wrapper {
            position: relative;
            height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        button {
            padding: 12px 35px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        #yesBtn { background-color: #ff4d6d; color: white; }
        #noBtn { background-color: #222; color: #ff4d6d; position: absolute; top: 75px; transition: 0.1s ease-out; z-index: 999; }

        .footer-text { font-size: 11px; color: #888; margin-top: 25px; font-style: italic; }
        .hidden { display: none; }
        .paper { background: #fff; padding: 20px; border-radius: 10px; text-align: left; margin-top: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .heart-drop { position: absolute; top: -20px; color: #ff4d6d; font-size: 22px; pointer-events: none; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
        input[type="text"] { padding: 12px; border-radius: 10px; border: 1px solid #ffcad4; width: 80%; margin-bottom: 10px; outline: none; }
    </style>
</head>
<body>

    <div id="loader-overlay">
        <div class="progress-box">
            <div class="percent-display" id="pct">0%</div>
            <div class="progress-fill" id="pBar">
                <span class="loading-heart">❤️</span>
            </div>
        </div>
        <div class="loading-text">LOADING...</div>
    </div>

    <div class="slider-container" id="mainSlider">
        <section class="slide" id="page1">
            <div class="glass-card">
                <div class="emoji-header">🐱 ❤️</div>
                <h2>Sanskriti</h2>
                <h1>Do you love me!?</h1>
                <div class="btn-wrapper">
                    <button id="yesBtn" onclick="runLoading()">Yes 💖</button>
                    <button id="noBtn">No 🙈</button>
                </div>
                <p class="footer-text">Some love stories don't allow "no" 😤</p>
            </div>
        </section>

        <section class="slide">
            <div class="glass-card">
                <h1>You're special! ✨</h1>
                <p>Tumhari hansi meri sabse badi khushi hai. ❤️</p>
                <button onclick="nextSlide(2)" style="background:#ff4d6d;color:white;margin-top:20px">Next ➔</button>
            </div>
        </section>

        <section class="slide">
            <div class="glass-card">
                <h1>A promise... 🌸</h1>
                <p>Main humesha tumhare saath rahunga.</p>
                <button onclick="nextSlide(3)" style="background:#ff4d6d;color:white;margin-top:20px">Read Letter 💌</button>
            </div>
        </section>

        <section class="slide">
            <div id="rainContainer"></div>
            <div class="glass-card">
                <div id="lockSection">
                    <h1>A Private Letter 💌</h1>
                    <p>Type <b>10ml</b> to unlock</p><br>
                    <input type="text" id="passcode" placeholder="Enter code">
                    <button onclick="checkCode()" style="background:#ff4d6d;color:white">Open</button>
                </div>
                <div id="letterContent" class="hidden">
                    <div class="paper">
                        <h3 style="color:#ff4d6d">Dear Sanskriti,</h3>
                        <p>Yahan apna letter likhein...</p>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const slider = document.getElementById('mainSlider');
        const overlay = document.getElementById('loader-overlay');
        const pBar = document.getElementById('pBar');
        const pct = document.getElementById('pct');

        function setProgress(val) {
            pBar.style.width = val + "%";
            pct.innerText = val + "%";
        }

        async function runLoading() {
            // Step 1: Vanish Page 1
            document.getElementById('page1').style.opacity = "0";
            overlay.style.display = "flex";

            // 1% to 50%
            for(let i=1; i<=50; i++) {
                setProgress(i);
                await new Promise(r => setTimeout(r, 40));
            }

            // Wait 2 seconds at 50
            await new Promise(r => setTimeout(r, 2000));

            // 50% to 90%
            for(let i=51; i<=90; i++) {
                setProgress(i);
                await new Promise(r => setTimeout(r, 30));
            }

            // Back to 50%
            await new Promise(r => setTimeout(r, 600));
            setProgress(50);

            // Final to 90%
            await new Promise(r => setTimeout(r, 800));
            for(let i=51; i<=90; i++) {
                setProgress(i);
                await new Promise(r => setTimeout(r, 20));
            }

            // Transition to Page 2
            await new Promise(r => setTimeout(r, 500));
            overlay.style.opacity = "0";
            setTimeout(() => {
                overlay.style.display = "none";
                nextSlide(1); // Direct jump to page 2
            }, 400);
        }

        const moveNoButton = (e) => {
            if(e.type === 'touchstart') e.preventDefault();
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;
            const padding = 50;
            const maxX = window.innerWidth - btnWidth - padding;
            const maxY = window.innerHeight - btnHeight - padding;
            let randomX = Math.floor(Math.random() * (maxX - padding)) + padding;
            let randomY = Math.floor(Math.random() * (maxY - padding)) + padding;
            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        };

        noBtn.addEventListener('mouseover', moveNoButton);
        noBtn.addEventListener('touchstart', moveNoButton);

        function nextSlide(idx) {
            slider.style.transform = `translateX(-${idx * 100}vw)`;
            if(idx > 0) noBtn.style.display = 'none';
            if(idx === 3) startHeartRain();
        }

        function checkCode() {
            if(document.getElementById('passcode').value === "10ml") {
                document.getElementById('lockSection').classList.add('hidden');
                document.getElementById('letterContent').classList.remove('hidden');
            } else { alert("Hint: 10ml"); }
        }

        function startHeartRain() {
            const container = document.getElementById('rainContainer');
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('heart-drop');
                heart.innerHTML = '💗';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 2 + 2) + 's';
                container.appendChild(heart);
                setTimeout(() => heart.remove(), 4000);
            }, 300);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do you love me?</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #ffe6e6, #ffcccc); /* Soft pinkish background */
            overflow: hidden;
            position: relative;
        }

        /* Transition classes for sliding to next page */
        .slide-out-left {
            transform: translateX(-150vw);
            transition: transform 0.8s ease-in-out;
        }

        /* Glassmorphism Card */
        .card {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(255, 138, 152, 0.2);
            width: 90%;
            max-width: 400px;
            z-index: 10;
            transition: transform 0.8s ease-in-out;
        }

        .icons {
            font-size: 50px;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .icons span {
            filter: drop-shadow(0px 0px 8px rgba(255,0,0,0.4)); /* Glowing effect */
        }

        h1 {
            color: #333;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 30px;
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            height: 50px;
        }

        button {
            padding: 10px 25px;
            font-size: 16px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: transform 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .yes-btn {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: white;
            z-index: 2;
        }

        .yes-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
        }

        .no-btn {
            background: white;
            color: #333;
            position: absolute;
            left: 55%; /* Default position */
        }

        .footer-text {
            margin-top: 30px;
            font-size: 12px;
            color: #777;
            font-style: italic;
        }

        /* Floating Hearts Animation */
        .floating-heart {
            position: absolute;
            font-size: 20px;
            color: rgba(255, 117, 140, 0.6);
            animation: floatUp linear infinite;
            z-index: 1;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="hearts-container"></div>

    <div class="card" id="mainCard">
        <div class="icons">
            <span>😸</span><span>❤️</span>
        </div>
        <h1>Do you love me !?</h1>
        
        <div class="buttons-container">
            <button class="yes-btn" id="yesBtn">Yes 💖</button>
            <button class="no-btn" id="noBtn">No 🙅🏻‍♀️</button>
        </div>

        <div class="footer-text">
            Some love stories don't allow 'no' ✨
        </div>
    </div>

    <script>
        // 1. Moving "No" Button Logic
        const noBtn = document.getElementById('noBtn');
        const card = document.getElementById('mainCard');

        function moveButton() {
            // Screen limits calculate karke bounds banaye
            const maxX = window.innerWidth - noBtn.clientWidth - 20; 
            const maxY = window.innerHeight - noBtn.clientHeight - 20;

            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            // Change position to fixed so it can go anywhere on screen, not just inside card
            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        // Mobile touch aur desktop hover dono ke liye event listeners
        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Click rokne ke liye
            moveButton();
        });

        // 2. "Yes" Button Click -> Slide out transition
        document.getElementById('yesBtn').addEventListener('click', () => {
            // Card ko left side slide kar dega
            card.classList.add('slide-out-left');
            
            // Yahan aap next page (Page 2) par redirect kar sakte hain
            setTimeout(() => {
                // Example: window.location.href = "page2.html";
                alert('Slide 1 complete! Now link this to page2.html in your code.');
            }, 800); // 0.8s wait karega slide hone ka
        });

        // 3. Floating Hearts Generator
        function createHeart() {
            const heart = document.createElement('div');
            heart.innerHTML = '❤️';
            heart.classList.add('floating-heart');
            
            // Random styling
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 4 + 's'; // 4s to 7s
            heart.style.fontSize = Math.random() * 15 + 10 + 'px'; // 10px to 25px
            
            document.getElementById('hearts-container').appendChild(heart);
            
            // Remove after animation to save memory
            setTimeout(() => {
                heart.remove();
            }, 7000);
        }

        setInterval(createHeart, 300); // Har 300ms mein naya heart
    </script>

</body>
</html>

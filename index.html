<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Love Page</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #e8cfc8;
    font-family: Arial;
    text-align: center;
}

iframe {
    width: 180px;
    height: 180px;
    border: none;
}

button {
    padding: 10px 18px;
    margin: 10px;
    border: none;
    border-radius: 10px;
    background: white;
    cursor: pointer;
}

#noBtn {
    position: absolute;
}
</style>
</head>

<body>

<div>
    <iframe id="gif" src="https://giphy.com/embed/JIX9t2j0ZTN9S"></iframe>
    <h2 id="text">Do you love me? 🥺</h2>
    <p>Chiku is all yours</p>

    <button onclick="yes()">Yes</button>
    <button id="noBtn" onclick="no()">No</button>
</div>

<script>

let step = 0;

function yes(){
    document.getElementById("gif").src =
    "https://giphy.com/embed/MDJ9IbxxvDUQM";

    document.getElementById("text").innerText =
    "I knew it! You Love me 😘";
}

function no(){
    step++;

    if(step == 1){
        document.getElementById("gif").src =
        "https://giphy.com/embed/3oriO0OEd9QIDdllqo";

        document.getElementById("text").innerText =
        "Please think again 🥺";
    }

    else if(step == 2){
        document.getElementById("gif").src =
        "https://giphy.com/embed/l378giAZgxPw3eO52";

        document.getElementById("text").innerText =
        "Baby maan jao na 😭";
    }

    move();
}

function move(){
    let btn = document.getElementById("noBtn");

    let x = Math.random() * (window.innerWidth - 100);
    let y = Math.random() * (window.innerHeight - 50);

    btn.style.left = x + "px";
    btn.style.top = y + "px";
}

</script>

</body>
</html>

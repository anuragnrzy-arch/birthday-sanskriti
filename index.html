<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You ❤️</title>

<style>
body {
    margin: 0;
    overflow: hidden; /* ❌ scroll band */
    font-family: Arial;
    background: linear-gradient(135deg, #ffd6e0, #d6ecff);
}

/* SLIDER */
.slider {
    display: flex;
    width: 400vw;
    height: 100vh;
    transition: transform 0.6s ease-in-out;
}

.slide {
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    text-align: center;
    max-width: 300px;
}

img {
    width: 160px;
}

button {
    padding: 10px 18px;
    margin: 10px;
    border-radius: 10px;
    border: none;
    background: white;
    cursor: pointer;
}

/* 🔥 FIX */
#noBtn {
    position: fixed; /* 👈 important */
}
</style>
</head>

<body>

<div class="slider" id="slider">

<!-- SLIDE 1 -->
<div class="slide">
<div class="container">
<img src="https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif">
<h2>Do you love me? 🥺</h2>

<button onclick="goSlide(1)">Yes</button>
<button id="noBtn" onclick="moveNo()">No</button>
</div>
</div>

<!-- SLIDE 2 -->
<div class="slide">
<div class="container">
<h2>We broke up 💔</h2>
<button onclick="goSlide(2)">Next</button>
</div>
</div>

<!-- SLIDE 3 -->
<div class="slide">
<div class="container">
<h2>We came back 💖</h2>
<button onclick="goSlide(3)">Next</button>
</div>
</div>

<!-- SLIDE 4 -->
<div class="slide">
<div class="container">
<h2>May 9 💫</h2>
<p>I love you ❤️</p>
</div>
</div>

</div>

<script>

// SLIDE MOVE
function goSlide(i){
    document.getElementById("slider").style.transform =
    "translateX(-" + i + "00vw)";
}

// 😆 FIXED MOVE
function moveNo(){
    let btn = document.getElementById("noBtn");

    let x = Math.random() * (window.innerWidth - 80);
    let y = Math.random() * (window.innerHeight - 50);

    btn.style.left = x + "px";
    btn.style.top = y + "px";
}

</script>

</body>
</html>

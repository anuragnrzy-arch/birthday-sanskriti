<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You ❤️</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    text-align: center;
    background: linear-gradient(135deg, #ffd6e0, #d6ecff);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
}

.container {
    padding: 20px;
    max-width: 320px;
    position: relative;
    z-index: 2;
}

img {
    width: 160px;
}

h2 {
    color: #333;
}

p {
    color: #555;
    font-size: 14px;
}

button {
    padding: 10px 18px;
    margin: 10px;
    border: none;
    border-radius: 10px;
    background: white;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

#noBtn {
    position: absolute;
}

/* 💖 HEARTS */
.heart {
    position: absolute;
    color: red;
    font-size: 20px;
    animation: fall linear infinite;
}

@keyframes fall {
    0% {transform: translateY(-10vh);}
    100% {transform: translateY(110vh);}
}
</style>
</head>

<body>

<div class="container">

<img id="gif" src="https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif">

<h2 id="title">Do you love me? 🥺</h2>
<p id="text">Be honest 💖</p>

<button id="yesBtn" onclick="yes()">Yes</button>
<button id="noBtn" onclick="moveNo()">No</button>

</div>

<script>

let step = 0;

// ❤️ YES CLICK
function yes(){
    step = 1;

    document.getElementById("gif").src =
    "https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif";

    document.getElementById("title").innerText =
    "We broke up… 💔";

    document.getElementById("text").innerText =
    "That phase was really hard for me… I missed you every single day.";

    document.getElementById("noBtn").style.display = "none";

    document.getElementById("yesBtn").innerText = "Next ➡️";
    document.getElementById("yesBtn").setAttribute("onclick","next()");
}

// ➡️ NEXT SLIDES
function next(){
    step++;

    if(step == 2){
        document.getElementById("gif").src =
        "https://media.giphy.com/media/l378giAZgxPw3eO52/giphy.gif";

        document.getElementById("title").innerText =
        "But we found each other again 💖";

        document.getElementById("text").innerText =
        "After 1 year… we are back. And honestly, it feels even more special than before.";
    }

    else if(step == 3){
        document.getElementById("gif").src =
        "https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif";

        document.getElementById("title").innerText =
        "May 9 💫";

        document.getElementById("text").innerText =
        "May 9… the day we met, the day that changed everything for me. I still remember every little moment of that day, the way we talked, the way I felt around you… it was different, it was special. Even after everything we went through, after the distance, the silence, and the pain… somehow we found our way back to each other. And that means more to me than anything else. I don’t want to lose you again. I just want to stay, to make more memories with you, and to keep you happy. I love you ❤️";

        document.getElementById("yesBtn").innerText = "❤️";

        startHearts(); // 💖 START RAIN
    }
}

// 😆 NO BUTTON MOVE
function moveNo(){
    let btn = document.getElementById("noBtn");

    let x = Math.random() * (window.innerWidth - 100);
    let y = Math.random() * (window.innerHeight - 50);

    btn.style.left = x + "px";
    btn.style.top = y + "px";
}

// 💖 HEART RAIN FUNCTION
function startHearts(){
    setInterval(() => {
        let heart = document.createElement("div");
        heart.className = "heart";
        heart.innerText = "💖";

        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (Math.random() * 20 + 10) + "px";
        heart.style.animationDuration = (Math.random() * 3 + 2) + "s";

        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 5000);

    }, 200);
}

</script>

</body>
</html>

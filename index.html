<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#3b1f1f;
  font-family:sans-serif;
}

/* BOX */
.box{
  width:280px;
  padding:30px;
  background:#5a2c2c;
  border-radius:20px;
  text-align:center;
  box-shadow:0 0 30px rgba(255,0,80,0.4);
  position:relative;
}

/* EMOJI */
.emoji{
  font-size:30px;
}

/* TEXT */
h2{
  color:#ffdede;
  margin:10px 0 20px;
}

/* BUTTONS */
button{
  display:block;
  width:70%;
  margin:10px auto;
  padding:12px;
  border:none;
  border-radius:20px;
  font-size:16px;
}

.yes{
  background:#ff4d6d;
  color:white;
}

.no{
  background:black;
  color:white;
  position:absolute;
}
</style>

</head>

<body>

<div class="box" id="box">

  <div class="emoji">😍❤️</div>
  <h2>Do you love me!?</h2>

  <button class="yes" onclick="alert('Good 😏')">Yes</button>
  <button class="no" id="noBtn">No</button>

</div>

<script>

const noBtn = document.getElementById("noBtn");
const box = document.getElementById("box");

/* start position (below YES) */
noBtn.style.left = "50%";
noBtn.style.top = "75%";
noBtn.style.transform = "translate(-50%,-50%)";

/* move INSIDE box only */
noBtn.addEventListener("mouseover", () => {

  const rect = box.getBoundingClientRect();

  const x = Math.random() * (rect.width - 100);
  const y = Math.random() * (rect.height - 50);

  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
});

/* disable click */
noBtn.onclick = (e)=> e.preventDefault();

</script>

</body>
</html>

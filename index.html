<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Love</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  height:100vh;
  background:#5a2c2c;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  font-family:sans-serif;
}

/* Card */
.card{
  width:280px;
  padding:30px;
  background:#6d3a3a;
  border-radius:25px;
  text-align:center;
  box-shadow:0 0 40px rgba(255,0,80,0.4);
}

/* PIXEL HEART */
.pixel-heart{
  width:40px;
  height:40px;
  margin:auto;
  background:red;
  position:relative;
  transform:rotate(-45deg);
  animation: glow 1s infinite alternate;
}

.pixel-heart::before,
.pixel-heart::after{
  content:'';
  width:40px;
  height:40px;
  background:red;
  border-radius:50%;
  position:absolute;
}

.pixel-heart::before{
  top:-20px;
  left:0;
}

.pixel-heart::after{
  left:20px;
  top:0;
}

@keyframes glow{
  from{ box-shadow:0 0 10px red;}
  to{ box-shadow:0 0 25px pink;}
}

/* Text */
h2{
  color:#f5dede;
  margin:15px 0;
}

/* Buttons row */
.buttons{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:10px;
}

/* Buttons */
button{
  padding:10px 20px;
  border:none;
  border-radius:20px;
  font-size:16px;
  cursor:pointer;
}

.yes{
  background:#ff4d6d;
  color:white;
}

.no{
  background:black;
  color:white;
  position:absolute;
}

/* Rain */
.rain{
  position:fixed;
  top:-20px;
  font-size:14px;
  animation: fall linear infinite;
}

@keyframes fall{
  to{
    transform:translateY(100vh);
  }
}

</style>
</head>

<body>

<div class="card">
  <div class="pixel-heart"></div>
  <h2>Do you love me?</h2>

  <div class="buttons">
    <button class="yes" onclick="nextPage()">Yes ❤️</button>
    <button class="no" id="noBtn">No 😒</button>
  </div>
</div>

<script>
const noBtn = document.getElementById("noBtn");

/* Move button inside screen */
noBtn.addEventListener("mouseover", move);

function move(){
  const x = Math.random() * (window.innerWidth - 100);
  const y = Math.random() * (window.innerHeight - 50);

  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}

/* Next page */
function nextPage(){
  alert("Next slide 😏");
}

/* Heart rain */
function createHeart(){
  const heart = document.createElement("div");
  heart.classList.add("rain");
  heart.innerHTML = "💗";

  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = (2 + Math.random()*3) + "s";

  document.body.appendChild(heart);

  setTimeout(()=>heart.remove(),5000);
}

setInterval(createHeart,300);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Do you love me?</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background: #e8cfc8;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
    }

    .container {
        background: transparent;
    }

    img {
        width: 120px;
        margin-bottom: 15px;
    }

    h1 {
        font-size: 24px;
        margin: 10px 0;
    }

    p {
        font-size: 14px;
        color: #555;
    }

    .btn {
        padding: 10px 18px;
        margin: 10px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        background: white;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    #noBtn {
        position: absolute;
    }
</style>
</head>

<body>

<div class="container" id="main">
    <img id="gif" src="https://media.tenor.com/qjX6dC4qKpUAAAAi/cute-cat.gif">
    <h1 id="text">Do you love me? 🥺</h1>
    <p id="sub">Chiku is all yours</p>

    <button class="btn" onclick="yesClicked()">Yes</button>
    <button class="btn" id="noBtn" onclick="noClicked()">No</button>
</div>

<script>

let stage = 0;

function yesClicked() {
    document.getElementById("gif").src =
    "https://media.tenor.com/2roX3uxz_68AAAAi/cat-love.gif";

    document.getElementById("text").innerText =
    "I knew it! You Love me a lot 😘";

    document.getElementById("sub").innerText = "";

    document.getElementById("noBtn").style.display = "none";
}

function noClicked() {
    stage++;

    if(stage == 1){
        document.getElementById("gif").src =
        "https://media.tenor.com/tw4eQy6cGvMAAAAi/cute-cry.gif";

        document.getElementById("text").innerText =
        "Please think again! 🥺";

        document.getElementById("sub").innerText =
        "itni jaldi na matt bolo 😢";
    }

    else if(stage == 2){
        document.getElementById("gif").src =
        "https://media.tenor.com/5i8g9C3pR1QAAAAi/cat-begging.gif";

        document.getElementById("text").innerText =
        "Baby maan jao na! Kitna bhav khaogi 😭";

        document.getElementById("sub").innerText =
        "bhut glt baat hai yrr 😭";
    }

    moveButton();
}

function moveButton(){
    let btn = document.getElementById("noBtn");

    let x = Math.random() * (window.innerWidth - 100);
    let y = Math.random() * (window.innerHeight - 50);

    btn.style.left = x + "px";
    btn.style.top = y + "px";
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Sanskriti</title>
    <style>
        * { 
            margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            user-select: none;
        }
        body { background-color: #fce4ec; overflow: hidden; touch-action: none; }
        #no-message-box { position: fixed; top: -200px; left: 50%; transform: translateX(-50%); z-index: 1000; transition: top 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; flex-direction: column; align-items: center; }
        .string { width: 2px; height: 60px; background: #ff4d6d; margin: 0 45px; position: relative; }
        .string::before { content: ''; position: absolute; top: -10px; left: -2px; width: 6px; height: 6px; background: #ff4d6d; border-radius: 50%; }
        .strings-container { display: flex; justify-content: center; width: 100%; }
        .hanging-card { background: white; padding: 12px 20px; border-radius: 12px; box-shadow: 0 8px 20px rgba(255, 77, 109, 0.15); border: 2px solid #ff4d6d; font-weight: bold; color: #ff4d6d; font-size: 16px; white-space: nowrap; margin-top: -2px; }
        #master-lock-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fdf2f5; z-index: 20000; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: all 0.8s cubic-bezier(0.65, 0, 0.35, 1); }
        #error-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.2); z-index: 30000; display: none; justify-content: center; align-items: center; }
        .error-popup { background: white; padding: 25px; border-radius: 15px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 280px; border: 2px solid #ff4d6d; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .error-msg { color: #333; font-weight: bold; margin-bottom: 20px; font-size: 16px; line-height: 1.4; }
        .lock-icon { font-size: 80px; margin-bottom: 20px; transition: transform 1s ease; }
        .lock-input-box { background: rgba(255, 240, 245, 0.9); padding: 30px; border-radius: 20px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); text-align: center; width: 85%; max-width: 320px; border: 1px solid rgba(255, 182, 193, 0.5); box-shadow: 0 0 20px rgba(255, 77, 109, 0.3), 0 0 40px rgba(255, 77, 109, 0.1); animation: glowPulse 2s infinite alternate; }
        @keyframes glowPulse { from { box-shadow: 0 0 15px rgba(255, 77, 109, 0.2), 0 0 30px rgba(255, 77, 109, 0.1); } to { box-shadow: 0 0 30px rgba(255, 77, 109, 0.5), 0 0 50px rgba(255, 77, 109, 0.3); } }
        .slider-container { display: flex; width: 600vw; height: 100vh; transition: transform 0.8s cubic-bezier(0.65, 0, 0.35, 1); }
        .slide { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #fdf2f5 0%, #fce4ec 100%); }
        .glass-card { background: rgba(255, 245, 247, 0.9); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-radius: 25px; padding: 40px 20px; text-align: center; width: 90%; max-width: 350px; transition: opacity 0.4s ease; box-shadow: 0 8px 32px rgba(255, 182, 193, 0.3); border: 1.5px solid rgba(255, 255, 255, 0.8); }
        .page2-container { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; position: relative; }
        .envelope-wrapper { position: relative; width: 280px; height: 180px; background: #ff4d6d; border-radius: 0 0 15px 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); z-index: 5; margin-top: 0px; transform: translateY(-40px); }
        .envelope-wrapper::before { content: ''; position: absolute; top: 0; left: 0; border-left: 140px solid transparent; border-right: 140px solid transparent; border-top: 100px solid #ff758f; transform-origin: top; transition: transform 0.5s ease; z-index: 10; }
        .envelope-wrapper.open::before { transform: rotateX(180deg); z-index: 4; }
        .letter-content { position: absolute; top: 10px; left: 50%; transform: translateX(-50%) translateY(0); width: 260px; height: 160px; background: white; border-radius: 10px; padding: 20px; transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1); z-index: 6; opacity: 0; box-shadow: 0 5px 15px rgba(0,0,0,0.1); overflow: hidden; pointer-events: none; }
        .envelope-wrapper.open .letter-content { opacity: 1; transform: translateX(-50%) translateY(-240px); width: 330px; height: 460px; z-index: 15; pointer-events: auto; transition-delay: 0.6s; }
        .scroll-box-page2 { height: 100%; overflow-y: auto; text-align: left; font-size: 14px; color: #444; line-height: 1.6; padding-right: 5px; }
        .cat-image-sorry { width: 100%; max-width: 180px; display: block; margin: 15px auto 5px auto; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .scroll-box-page2::-webkit-scrollbar { width: 3px; }
        .scroll-box-page2::-webkit-scrollbar-thumb { background: #ff4d6d; }
        .reveal-title { font-family: 'Brush Script MT', cursive, sans-serif; color: #ff4d6d; font-size: 32px; margin-bottom: 30px; text-align: center; text-shadow: 0 0 10px rgba(255, 77, 109, 0.5); }
        .main-reveal-box { background: rgba(0, 0, 0, 0.2); padding: 20px; border-radius: 20px; width: 90%; max-width: 320px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 0 20px rgba(255, 77, 109, 0.3); }
        .rectangle-box { background: rgba(255, 255, 255, 0.1); min-height: 60px; border-radius: 15px; display: flex; justify-content: center; align-items: center; color: white; font-size: 18px; padding: 10px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.2); cursor: pointer; transition: transform 0.2s; position: relative; overflow: hidden; }
        .fade-left { animation: fadeLeft 1s forwards; }
        .fade-right { animation: fadeRight 1s forwards; }
        .fade-middle { animation: fadeIn2 1s forwards; }
        @keyframes fadeLeft { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes fadeRight { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes fadeIn2 { from { opacity: 0; } to { opacity: 1; } }
        .see-more-btn { background: #ff4d6d; color: white; padding: 12px 30px; border-radius: 25px; border: none; font-weight: bold; margin-top: 30px; cursor: pointer; box-shadow: 0 0 15px rgba(255, 77, 109, 0.6); transition: 0.3s; }
        .note-title { font-family: 'Brush Script MT', cursive, sans-serif; color: #ff4d6d; font-size: 34px; margin-bottom: 25px; text-align: center; }
        .note-box { background: #ffecf2; width: 280px; height: 180px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(255, 182, 193, 0.6); border: 2px solid rgba(255, 255, 255, 0.8); position: relative; cursor: pointer; transition: transform 0.2s; }
        .note-box:active { transform: scale(0.97); }
        .pink-circle { width: 70px; height: 70px; background: #ff4d6d; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin-bottom: 12px; box-shadow: 0 4px 10px rgba(255, 77, 109, 0.3); animation: heartbeat 1.5s ease-in-out infinite; }
        @keyframes heartbeat { 0%,100%{transform:scale(1)} 30%{transform:scale(1.1)} 60%{transform:scale(1.05)} }
        .white-heart { font-size: 35px; color: white; }
        .tap-open-text { color: #ff4d6d; font-weight: bold; font-size: 16px; letter-spacing: 1px; }
        .next-btn-note { background: #007bff; color: white; padding: 12px 40px; border-radius: 25px; border: none; font-weight: bold; margin-top: 40px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,123,255,0.3); }
        .action-btns-page2 { position: absolute; bottom: 80px; display: flex; flex-direction: row; justify-content: center; align-items: center; gap: 15px; z-index: 25; width: 100%; padding: 0 20px; }
        #openBtn { background: white; color: #ff4d6d; width: 140px; border: 2px solid #ff4d6d; box-shadow: 0 4px 10px rgba(255, 77, 109, 0.1); }
        #nextBtn2 { background: #007bff; color: white; width: 140px; box-shadow: 0 4px 10px rgba(0,123,255,0.2); }
        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fdf2f5; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 10000; }
        .loader-card { width: 85%; max-width: 320px; padding: 40px 20px; background: rgba(255, 245, 247, 0.9); border-radius: 25px; backdrop-filter: blur(15px); text-align: center; box-shadow: 0 8px 32px rgba(255, 182, 193, 0.3); border: 1.5px solid rgba(255, 255, 255, 0.8); }
        .progress-container { width: 100%; height: 14px; background: #eee; border-radius: 20px; position: relative; margin-top: 10px; }
        .progress-bar { width: 0%; height: 100%; background: #ff4d6d; border-radius: 20px; transition: width 0.2s ease; }
        .pct-text { position: absolute; right: 0; top: -22px; font-size: 13px; font-weight: bold; color: #ff4d6d; }
        .btn-wrapper { position: relative; height: 150px; display: flex; flex-direction: column; align-items: center; }
        button { padding: 12px 20px; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; font-size: 15px; transition: 0.3s; }
        #yesBtn { background-color: #ff4d6d; color: white; box-shadow: 0 4px 15px rgba(255, 77, 109, 0.3); }
        #noBtn { background-color: #444; color: #fff; position: absolute; top: 70px; z-index: 999; }
        .footer-text { font-size: 11px; color: #a38b91; margin-top: 25px; font-style: italic; }
        input[type="text"] { padding: 12px; border-radius: 10px; border: 1.5px solid #ffcad4; width: 85%; margin-bottom: 15px; outline: none; text-align: center; background: white; }
        #something-special-page { transition: opacity 1.5s ease; }
        .special-slide { background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%) !important; flex-direction: column; position: relative; overflow: hidden; }
        .special-title { color: white; font-size: 40px; font-weight: bold; margin-bottom: 5px; text-shadow: 2px 2px 10px rgba(0,0,0,0.1); z-index: 10; }
        .special-subtitle { color: white; font-size: 22px; font-style: italic; margin-bottom: 40px; opacity: 0.9; z-index: 10; }
        .begin-btn { background: #ff4d6d !important; color: white !important; padding: 15px 45px; border-radius: 35px; font-size: 18px; font-weight: bold; border: none; z-index: 10; box-shadow: 0 5px 20px rgba(255, 77, 109, 0.4); }
        .floating-heart { position: absolute; bottom: -50px; color: rgba(255, 77, 109, 0.4); font-size: 20px; animation: floatUp linear infinite; z-index: 1; pointer-events: none; }
        @keyframes floatUp { to { transform: translateY(-110vh) rotate(360deg); opacity: 0; } }
        #final-letter-page { display: none; opacity: 0; transition: opacity 3s ease; background: #fce4ec; width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; z-index: 5000; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 40px; overflow-y: scroll; overflow-x: hidden; }
        #bg-heart-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .letter-love-header { color: #ff4d6d; font-size: 28px; font-weight: bold; margin-bottom: 5px; z-index: 10; position: relative; }
        .letter-subtitle { color: #888; font-size: 16px; margin-bottom: 25px; z-index: 10; position: relative; }
        .white-paper { background: white; width: 90%; max-width: 350px; border-radius: 15px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 40px; position: relative; flex-shrink: 0; z-index: 10; }
        .red-letter-title { color: #ff4d6d; font-size: 18px; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .scroll-text { color: #555; font-size: 15px; line-height: 1.6; text-align: left; max-height: 350px; overflow-y: auto; padding-right: 5px; }
        .memories-container { width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 10; }
        .memories-title-box { background: white; padding: 15px 25px; border-radius: 20px; border: 2px solid #ff4d6d; box-shadow: 0 0 20px rgba(255, 77, 109, 0.4); color: #ff4d6d; font-weight: bold; font-size: 18px; text-align: center; margin-bottom: 40px; animation: glowPulse 2s infinite alternate; }
        .zig-zag-grid { width: 90%; display: flex; flex-direction: column; gap: 40px; padding-bottom: 60px; }
        .memory-photo { width: 200px; height: 280px; background: white; padding: 8px; border: 2px solid #ff4d6d; border-radius: 10px; box-shadow: 0 0 15px rgba(255, 77, 109, 0.5), 0 5px 15px rgba(0,0,0,0.2); overflow: hidden; animation: waveFloat 4s ease-in-out infinite; }
        @keyframes waveFloat { 0%, 100% { transform: translateY(0) rotate(var(--rot)); } 50% { transform: translateY(-15px) rotate(var(--rot-mid)); } }
        .memory-photo img { width: 100%; height: 100%; object-fit: cover; border-radius: 5px; }
        .pos-1 { align-self: flex-start; --rot: -6deg; --rot-mid: -3deg; }
        .pos-2 { align-self: flex-end; --rot: 6deg; --rot-mid: 3deg; }
        .pos-3 { align-self: flex-start; --rot: -4deg; --rot-mid: -1deg; }
        .extra-blank-space { height: 100px; width: 100%; flex-shrink: 0; }

        /* ===== SPOTIFY OVERLAY ===== */
        #sp-overlay {
            display: none; position: fixed; inset: 0; z-index: 50000;
            align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.5s ease;
        }
        #sp-overlay.sp-on { display: flex; }
        #sp-overlay.sp-visible { opacity: 1; }
        .sp-blur {
            position: absolute; inset: 0;
            background-size: cover; background-position: center top;
            filter: blur(28px) brightness(0.3) saturate(1.5);
            transform: scale(1.1);
        }
        .sp-blur::after { content:''; position:absolute; inset:0; background:rgba(6,2,8,0.5); }
        .sp-card {
            position: relative; z-index: 10; width: 330px;
            background: rgba(14,5,10,0.85); backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 26px;
            padding: 22px 20px 26px;
            box-shadow: 0 28px 70px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.08);
            transform: translateY(20px); transition: transform 0.5s cubic-bezier(0.34,1.2,0.64,1);
        }
        #sp-overlay.sp-visible .sp-card { transform: translateY(0); }
        .sp-x { position:absolute; top:11px; right:13px; background:rgba(255,255,255,0.08); border:none; color:rgba(255,255,255,0.5); border-radius:50%; width:28px; height:28px; font-size:13px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:0.2s; padding:0; }
        .sp-x:hover { background:rgba(255,255,255,0.18); color:#fff; }
        .sp-img { width:100%; height:190px; border-radius:15px; overflow:hidden; margin-bottom:16px; box-shadow:0 10px 35px rgba(0,0,0,0.55); position:relative; }
        .sp-img img { width:100%; height:100%; object-fit:cover; object-position:center top; }
        .sp-badge { position:absolute; top:8px; right:8px; background:rgba(0,0,0,0.6); backdrop-filter:blur(8px); border-radius:20px; padding:3px 9px; display:flex; align-items:center; gap:4px; font-size:0.6rem; color:#1db954; font-weight:700; letter-spacing:0.8px; }
        .sp-dot { width:6px; height:6px; background:#1db954; border-radius:50%; }
        .sp-dot.active { animation: spDotBlink 1s ease-in-out infinite; }
        @keyframes spDotBlink { 0%,100%{opacity:1} 50%{opacity:0.2} }
        .sp-title { font-size:1.18rem; font-weight:700; color:#fff; margin-bottom:2px; }
        .sp-artist { font-size:0.78rem; color:rgba(255,255,255,0.48); margin-bottom:13px; font-weight:300; }
        .sp-prog-bg { height:3px; background:rgba(255,255,255,0.15); border-radius:4px; overflow:hidden; cursor:pointer; margin-bottom:4px; }
        .sp-prog-fill { height:100%; background:linear-gradient(90deg,#1db954,#4ade80); border-radius:4px; width:0%; transition:width 0.3s linear; }
        .sp-times { display:flex; justify-content:space-between; font-size:0.63rem; color:rgba(255,255,255,0.35); margin-bottom:12px; }
        /* Lyrics */
        .sp-lyr-wrap { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); border-radius:13px; padding:10px 14px; height:90px; overflow:hidden; margin-bottom:18px; position:relative; }
        .sp-lyr-wrap::after { content:''; position:absolute; bottom:0; left:0; right:0; height:24px; background:linear-gradient(transparent,rgba(14,5,10,0.95)); border-radius:0 0 13px 13px; pointer-events:none; }
        .sp-lyr-line { font-size:0.79rem; color:rgba(255,255,255,0.3); line-height:1.75; text-align:center; transition:all 0.4s ease; }
        .sp-lyr-line.sp-on { color:#fff !important; font-weight:700; font-size:0.85rem; text-shadow:0 0 15px rgba(255,255,255,0.35); display:block; width:100%; }
        .sp-lyr-line.sp-was { color:rgba(255,255,255,0.5); }
        /* Controls */
        .sp-ctrls { display:flex; align-items:center; justify-content:center; gap:26px; }
        .sp-cbtn { background:none; border:none; cursor:pointer; color:rgba(255,255,255,0.55); transition:0.2s; display:flex; align-items:center; padding:5px; }
        .sp-cbtn:hover { color:#fff; transform:scale(1.1); }
        .sp-play { width:54px; height:54px; background:linear-gradient(135deg,#fff,#e0e0e0); border-radius:50%; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 4px 18px rgba(255,255,255,0.2); transition:0.2s; padding:0; }
        .sp-play:hover { transform:scale(1.07); }
        .sp-play svg { color:#111; }
        .sp-brand { display:flex; align-items:center; justify-content:center; gap:5px; margin-top:14px; }
        .sp-brand span { font-size:0.6rem; color:rgba(255,255,255,0.22); letter-spacing:0.8px; text-transform:uppercase; }
    </style>
</head>

        </div>
        <div class="hanging-card" id="no-msg-text">No kaise bola? 😤</div>
    </div>

    <div id="bg-heart-container"></div>

    <div class="slider-container" id="slider">
        
        <div class="slide">
            <div class="glass-card">
                <img src="https://media.tenor.com/t796oK3jTfQAAAAj/peach-goma-peach-and-goma.gif" style="width: 140px; margin-bottom: 20px;">
                <h2 style="color: #ff4d6d; margin-bottom: 15px;">Sanskriti... ❤️</h2>
                <p style="color: #555; margin-bottom: 30px; line-height: 1.5;">Since you are here, can I ask you something very important?</p>
                <div class="btn-wrapper">
                    <button id="yesBtn">Yes, sure! ✨</button>
                    <button id="noBtn">No way 😒</button>
                </div>
                <p class="footer-text">Don't try to click 'No', I've made it impossible.</p>
            </div>
        </div>

        <div class="slide">
            <div class="page2-container">
                <h2 class="note-title" id="page2-title">Something for you...</h2>
                
                <div class="envelope-wrapper" id="envelope">
                    <div class="letter-content">
                        <div class="scroll-box-page2">
                            <h4 style="color: #ff4d6d; margin-bottom: 10px;">Dear Sanskriti,</h4>
                            <p>Ab ye scroll ho sakta hai! 📜<br><br>
                            I just wanted to take a moment to tell you how much you mean to me. You are truly amazing and I am so glad I know you. <br><br>
                            Har din tumse baat karke mera din ban jata hai. Tumhari smile, tumhari baatein, sab kuch kitna pyaara hai! 🌸<br><br>
                            Sorry agar kabhi maine tumhe pareshaan kiya ho, but believe me, you're the best! 💖
                            </p>
                            <img src="https://media.tenor.com/2m72E_Fq4-EAAAAj/cute-cat.gif" class="cat-image-sorry">
                        </div>
                    </div>
                </div>

                <div class="action-btns-page2">
                    <button id="openBtn">Open Letter ✉️</button>
                    <button id="nextBtn2" style="display: none;">Continue ➔</button>
                </div>
            </div>
        </div>

        <div class="slide" style="background: #1a1a2e; flex-direction: column;">
            <h2 class="reveal-title">Secrets I kept... 🤫</h2>
            <div class="main-reveal-box">
                <div class="rectangle-box fade-left" onclick="showSecret(this, 'You look extra cute today! ✨')">Tap to reveal...</div>
                <div class="rectangle-box fade-right" onclick="showSecret(this, 'I smile at my phone when you text. 😊')">Tap to reveal...</div>
                <div class="rectangle-box fade-middle" onclick="showSecret(this, 'You are my favorite notification! 🔔❤️')">Tap to reveal...</div>
            </div>
            <button class="see-more-btn" onclick="nextSlide()">See More ❤️</button>
        </div>

        <div class="slide">
            <div class="page2-container">
                <h2 class="note-title">One Last Note...</h2>
                <div class="note-box" id="note-card" onclick="openSpotify()">
                    <div class="pink-circle">
                        <div class="white-heart">❤</div>
                    </div>
                    <p class="tap-open-text">TAP TO PLAY SONG 🎵</p>
                </div>
                <button class="next-btn-note" onclick="nextSlide()">Wait, there's more! ➔</button>
            </div>
        </div>

        <div class="slide special-slide" id="something-special-page">
            <h1 class="special-title">Something Special</h1>
            <p class="special-subtitle">just for you...</p>
            <button class="begin-btn" onclick="revealLetter()">CLICK HERE ✨</button>
            <div id="sp-heart-container"></div>
        </div>

    </div>

    <div id="final-letter-page">
        <div class="letter-love-header">Forever Yours?</div>
        <p class="letter-subtitle">A message from my heart 💌</p>

        <div class="white-paper">
            <div class="red-letter-title">The Real Truth...</div>
            <div class="scroll-text">
                Dear Sanskriti,<br><br>
                Every moment spent talking to you feels like a dream. I never thought I'd find someone who makes me feel this way. <br><br>
                Your kindness, your laughter, and the way you handle things - everything about you is special. I promise to always be there for you, through thick and thin.<br><br>
                You aren't just a friend, you are my favorite person. Let's make more memories together? ❤️<br><br>
                With love,<br>
                Yours Truly.
            </div>
        </div>

        <div class="memories-container">
            <div class="memories-title-box">OUR MEMORIES ✨</div>
            
            <div class="zig-zag-grid">
                <div class="memory-photo pos-1">
                    <img src="https://i.pinimg.com/736x/01/2d/8e/012d8ec1f6a153835619bc947700e470.jpg" alt="Memory 1">
                </div>
                <div class="memory-photo pos-2">
                    <img src="https://i.pinimg.com/736x/87/40/84/8740846114f09d363ef479f67a6ad41a.jpg" alt="Memory 2">
                </div>
                <div class="memory-photo pos-3">
                    <img src="https://i.pinimg.com/736x/8e/4a/02/8e4a0256860d5b128549746e50f38448.jpg" alt="Memory 3">
                </div>
            </div>
        </div>

        <div class="extra-blank-space"></div>
    </div>

    <div id="sp-overlay">
        <div class="sp-blur" id="sp-blur-bg"></div>
        <div class="sp-card">
            <button class="sp-x" onclick="closeSpotify()">✕</button>
            <div class="sp-img">
                <img src="https://i.scdn.co/image/ab67616d0000b2737070dba621238735239e2190" id="sp-cover">
                <div class="sp-badge">
                    <div class="sp-dot active"></div>
                    <span>PLAYING NOW</span>
                </div>
            </div>
            <div class="sp-title">Heeriye (feat. Arijit Singh)</div>
            <div class="sp-artist">Jasleen Royal, Arijit Singh, Dulquer Salmaan</div>
            
            <div class="sp-prog-bg" onclick="seekAudio(event)">
                <div class="sp-prog-fill" id="sp-fill"></div>
            </div>
            <div class="sp-times">
                <span id="sp-cur">0:00</span>
                <span id="sp-dur">3:14</span>
            </div>

            <div class="sp-lyr-wrap">
                <div id="sp-lyr-box">
                    <div class="sp-lyr-line" data-time="0">🎵 (Instrumental Intro) 🎵</div>
                </div>
            </div>

            <div class="sp-ctrls">
                <button class="sp-cbtn">
                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M7 6c.55 0 1 .45 1 1v10c0 .55-.45 1-1 1s-1-.45-1-1V7c0-.55.45-1 1-1zm3.66 4.82L17 6.29V17.71l-6.34-4.53c-.44-.32-.44-1.06 0-1.36z"/></svg>
                </button>
                <button class="sp-play" id="sp-toggle" onclick="togglePlay()">
                    <svg id="sp-icon-play" width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="sp-icon-pause" style="display:none" width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <button class="sp-cbtn">
                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M17 6c.55 0 1 .45 1 1v10c0 .55-.45 1-1 1s-1-.45-1-1V7c0-.55.45-1 1-1zM7 6.29l6.34 4.53c.44.32.44 1.06 0 1.36L7 17.71V6.29z"/></svg>
                </button>
            </div>

            <div class="sp-brand">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="#1db954"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.49 17.306c-.215.353-.674.464-1.026.249-2.85-1.742-6.438-2.135-10.665-1.17-.404.093-.81-.162-.903-.566-.093-.404.162-.81.566-.903 4.62-1.057 8.583-.61 11.78 1.344.352.215.463.674.248 1.026zm1.464-3.26c-.27.44-.847.58-1.286.31-3.256-2-8.22-2.583-12.067-1.415-.497.15-1.023-.13-1.173-.627-.15-.497.13-1.023.627-1.173 4.402-1.336 9.882-.678 13.59 1.6 0 .44.139.846.31 1.286zm.135-3.376c-3.903-2.318-10.338-2.53-14.095-1.39-.598.18-1.233-.145-1.415-.744-.18-.598.145-1.233.744-1.415 4.305-1.306 11.41-1.05 15.903 1.615.538.32.713 1.013.393 1.55-.32.538-1.013.713-1.55.393z"/></svg>
                <span>Spotify</span>
            </div>
        </div>
    </div>

    <script>
        const slider = document.getElementById('slider');
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const noMsgBox = document.getElementById('no-message-box');
        const noMsgText = document.getElementById('no-msg-text');
        const envelope = document.getElementById('envelope');
        const openBtn = document.getElementById('openBtn');
        const nextBtn2 = document.getElementById('nextBtn2');
        const page2Title = document.getElementById('page2-title');
        const loader = document.getElementById('loading-overlay');
        const pBar = document.getElementById('p-bar');
        const pctVal = document.getElementById('pct-val');
        const loaderTitle = document.getElementById('loader-title');
        const unlockBtn = document.getElementById('unlockBtn');
        const passcodeInp = document.getElementById('passcodeInput');
        const audio = document.getElementById('spAudio');

        const noMessages = [
            "No kaise bola? 😤",
            "Dobara socho... 🙄",
            "Pakka? Galat baat! 🥺",
            "Maan jao na please... ✨",
            "Ek baar 'Yes' daba ke dekho! ❤️"
        ];

        let currentSlide = 0;

        function nextSlide() {
            currentSlide++;
            slider.style.transform = `translateX(-${currentSlide * 100}vw)`;
        }

        const closeError = () => { document.getElementById('error-overlay').style.display = 'none'; };

        unlockBtn.addEventListener('click', () => {
            if(passcodeInp.value.toLowerCase() === 'sanskriti') {
                document.getElementById('master-lock-screen').style.opacity = '0';
                setTimeout(() => { document.getElementById('master-lock-screen').style.display = 'none'; }, 800);
            } else {
                document.getElementById('error-overlay').style.display = 'flex';
                passcodeInp.value = '';
            }
        });

        yesBtn.addEventListener('click', () => {
            loader.style.display = 'flex';
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 15;
                if(progress > 100) progress = 100;
                pBar.style.width = progress + '%';
                pctVal.innerHTML = Math.floor(progress) + '%';
                if(progress >= 100) {
                    clearInterval(interval);
                    loaderTitle.innerHTML = "Success! ❤️";
                    setTimeout(() => { loader.style.display = 'none'; nextSlide(); }, 1000);
                }
            }, 200);
        });

        openBtn.addEventListener('click', () => {
            envelope.classList.add('open');
            openBtn.style.display = 'none';
            page2Title.innerHTML = "A small note for you... ✨";
            setTimeout(() => { nextBtn2.style.display = 'block'; }, 2000);
        });

        nextBtn2.addEventListener('click', () => { nextSlide(); });

        function showSecret(el, msg) {
            if(el.innerHTML === 'Tap to reveal...') {
                el.innerHTML = msg;
                el.style.background = '#ff4d6d';
                el.style.fontWeight = 'bold';
            }
        }

        /* SPOTIFY LOGIC */
        const lyrics = [
            { t: 0, text: "🎵 (Instrumental Intro) 🎵" },
            { t: 15, text: "Galiyaan teri, galiyaan..." },
            { t: 19, text: "Mujhko bhaavein galiyaan teri galiyaan" },
            { t: 24, text: "Yoon hi tadpaavein, galiyaan teri galiyaan" },
            { t: 30, text: "Sanskriti, you are like a melody... ❤️" },
            { t: 38, text: "Har pal tumhara intezaar rehta hai." },
            { t: 45, text: "✨ Keep Smiling Always ✨" }
        ];

        function openSpotify() {
            const ov = document.getElementById('sp-overlay');
            ov.classList.add('sp-on');
            setTimeout(() => ov.classList.add('sp-visible'), 50);
            if(audio.paused) togglePlay();
        }

        function closeSpotify() {
            const ov = document.getElementById('sp-overlay');
            ov.classList.remove('sp-visible');
            setTimeout(() => ov.classList.remove('sp-on'), 500);
        }

        function togglePlay() {
            const playIcon = document.getElementById('sp-icon-play');
            const pauseIcon = document.getElementById('sp-icon-pause');
            if(audio.paused) {
                audio.play();
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                document.querySelector('.sp-dot').classList.add('active');
            } else {
                audio.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                document.querySelector('.sp-dot').classList.remove('active');
            }
        }

        audio.ontimeupdate = () => {
            const fill = document.getElementById('sp-fill');
            const cur = document.getElementById('sp-cur');
            const dur = document.getElementById('sp-dur');
            const box = document.getElementById('sp-lyr-box');
            
            const p = (audio.currentTime / audio.duration) * 100;
            fill.style.width = p + '%';
            
            cur.innerText = formatTime(audio.currentTime);
            if(!isNaN(audio.duration)) dur.innerText = formatTime(audio.duration);

            const activeLine = lyrics.reduce((prev, curr) => (audio.currentTime >= curr.t ? curr : prev), lyrics[0]);
            box.innerHTML = `<div class="sp-lyr-line sp-on">${activeLine.text}</div>`;
        };

        function formatTime(s) {
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${m}:${sec < 10 ? '0' : ''}${sec}`;
        }

        function seekAudio(e) {
            const bar = e.currentTarget;
            const p = (e.offsetX / bar.offsetWidth);
            audio.currentTime = p * audio.duration;
        }

        function startHearts(containerId) {
            const container = document.getElementById(containerId);
            if(!container) return;
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('floating-heart');
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
                container.appendChild(heart);
                setTimeout(() => heart.remove(), 5000);
            }, 400);
        }

        function revealLetter() {
            const specialPage = document.getElementById('something-special-page');
            specialPage.style.opacity = '0';
            setTimeout(() => {
                slider.style.display = 'none';
                const letterPage = document.getElementById('final-letter-page');
                letterPage.style.display = 'flex';
                document.body.style.overflowY = "auto";
                document.body.style.touchAction = "auto";
                startHearts('bg-heart-container');
                setTimeout(() => { letterPage.style.opacity = '1'; }, 50);
            }, 1500);
        }

        const moveNoButton = (e) => {
            if(e.type === 'touchstart') e.preventDefault();
            noMsgBox.style.top = '0px';
            const padding = 50;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;
            let randomX = Math.floor(Math.random() * (maxX - padding)) + padding;
            let randomY = Math.floor(Math.random() * (maxY - padding)) + padding;
            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
            const randomMsg = noMessages[Math.floor(Math.random() * noMessages.length)];
            noMsgText.innerHTML = randomMsg;
            setTimeout(() => { noMsgBox.style.top = '-200px'; }, 2000);
        };

        noBtn.addEventListener('mouseover', moveNoButton);
        noBtn.addEventListener('touchstart', moveNoButton);

        startHearts('sp-heart-container');
    </script>
</body>
</html>

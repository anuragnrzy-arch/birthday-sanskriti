<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do you love me?</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: #ffd6dc;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

.container {
  text-align: center;
  background: #ffc0cb;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 0 30px rgba(255, 0, 100, 0.3);
  position: relative;
}

h2 {
  color: #333;
}

.heart {
  font-size: 40px;
  animation: glow 1s infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 10px red; }
  to { text-shadow: 0 0 25px pink; }
}

.buttons {
  margin-top: 20px;
  position: relative;
}

button {
  padding: 10px 20px;
  border: none;
  border-radius: 20px;
  font-size: 16px;
  cursor: pointer;
}

.yes {
  background: #ff4d6d;
  color: white;
}

.no {
  background: white;
  position: absolute;
}

</style>
</head>

<body>

<div class="container">
  <div class="heart">❤️</div>
  <h2>Do you love me?</h2>

  <div class="buttons">
    <button class="yes" onclick="nextPage()">Yes ❤️</button>
    <button class="no" id="noBtn">No 😒</button>
  </div>
</div>

<script>
const noBtn = document.getElementById("noBtn");

noBtn.addEventListener("mouseover", () => {
  const x = Math.random() * (window.innerWidth - 100);
  const y = Math.random() * (window.innerHeight - 50);

  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
});

function nextPage() {
  alert("Next page slide ayega 😏");
}
</script>

</body>
</html>

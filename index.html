<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>

body{
  margin:0;
  overflow:hidden;
  font-family:Arial;
  background:linear-gradient(135deg,#ffd6e0,#d6ecff);
}

/* SLIDES */
.slider{
  display:flex;
  width:400vw;
  height:100vh;
  transition:0.5s;
}

.slide{
  width:100vw;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.container{
  width:80%;
}

/* UI */
img{width:140px;}

button{
  padding:10px 18px;
  margin:10px;
  border:none;
  border-radius:10px;
  background:white;
}

/* 🔥 NO BUTTON FIX */
#noBtn{
  position:fixed;
}

/* 💖 HEART */
.heart{
  position:fixed;
  top:-20px;
  animation:fall linear forwards;
}

@keyframes fall{
  to{transform:translateY(110vh);}
}

</style>
</head>

<body>

<div class="slider" id="slider">

<!-- 1 -->
<div class="slide">
<div class="container">
<img src="https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif">
<h2>Do you love me? 🥺</h2>

<button onclick="go(1)">Yes</button>
<button id="noBtn" onclick="moveNo()">No</button>
</div>
</div>

<!-- 2 -->
<div class="slide">
<div class="container">
<img src="https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif">
<h2>We broke up 💔</h2>
<p>I missed you every day...</p>

<button onclick="go(2)">Next</button>
</div>
</div>

<!-- 3 -->
<div class="slide">
<div class="container">
<img src="https://media.giphy.com/media/l378giAZgxPw3eO52/giphy.gif">
<h2>We came back 💖</h2>
<p>After 1 year... we fixed everything.</p>

<button onclick="go(3)">Next</button>
</div>
</div>

<!-- 4 -->
<div class="slide">
<div class="container">
<img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif">
<h2>May 9 💫</h2>
<p>
May 9... the most special day of my life.
Even after everything, we came back.
I don’t want to lose you again.
I love you ❤️
</p>
</div>
</div>

</div>

<script>

function go(i){
  document.getElementById("slider").style.transform =
  "translateX(-"+i+"00vw)";

  if(i==3) hearts();
}

/* 😆 NO BUTTON (SCREEN KE ANDAR HI) */
function moveNo(){
  let x=Math.random()*(window.innerWidth-80);
  let y=Math.random()*(window.innerHeight-50);

  noBtn.style.left=x+"px";
  noBtn.style.top=y+"px";
}

/* 💖 HEART RAIN */
function hearts(){
  setInterval(()=>{
    let h=document.createElement("div");
    h.className="heart";
    h.innerText="💖";

    h.style.left=Math.random()*100+"vw";
    h.style.fontSize=(Math.random()*20+10)+"px";
    h.style.animationDuration=(Math.random()*2+3)+"s";

    document.body.appendChild(h);

    setTimeout(()=>h.remove(),4000);
  },200);
}

</script>

</body>
</html>

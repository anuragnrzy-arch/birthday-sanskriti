<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Sanskriti</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            background-color: #ffcad4;
            overflow: hidden;
            touch-action: none; 
        }

        .slider-container {
            display: flex;
            width: 400vw;
            height: 100vh;
            transition: transform 0.6s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .slide {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: radial-gradient(circle, #ffdee9 0%, #ffcad4 100%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(255, 105, 135, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            width: 90%;
            max-width: 350px;
            z-index: 10;
            transition: all 0.5s ease;
        }

        /* Vanish Animation */
        .vanish-out {
            opacity: 0 !important;
            transform: scale(0.5) translateY(-100px) rotate(10deg) !important;
            pointer-events: none;
        }

        /* LOADING SCREEN OVERLAY - Pure screen pe */
        #loader-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #ffdee9;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .progress-wrapper {
            width: 85%;
            max-width: 300px;
            text-align: center;
        }

        .progress-container {
            width: 100%;
            height: 14px;
            background: #333;
            border-radius: 20px;
            position: relative;
            margin-top: 30px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #ff4d6d;
            border-radius: 20px;
            position: relative;
            transition: width 0.2s linear;
        }

        .progress-heart {
            position: absolute;
            right: -10px;
            top: -25px;
            font-size: 20px;
            animation: heartBounce 0.5s infinite alternate;
        }

        .percent-text {
            position: absolute;
            right: 0;
            top: -25px;
            font-size: 14px;
            font-weight: bold;
            color: #444;
        }

        @keyframes heartBounce {
            from { transform: translateY(0); }
            to { transform: translateY(-5px); }
        }

        .loading-label {
            margin-top: 15px;
            font-weight: bold;
            color: #444;
            letter-spacing: 3px;
            font-size: 14px;
        }

        /* OTHER STYLES */
        .emoji-header { font-size: 50px; margin-bottom: 10px; }
        h1 { font-size: 24px; margin-bottom: 30px; color: #222; }

        .btn-wrapper {
            position: relative;
            height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        button {
            padding: 12px 35px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }

        #yesBtn { background-color: #ff4d6d; color: white; }
        #noBtn { background-color: #222; color: #ff4d6d; position: absolute; top: 75px; z-index: 999; }

        .hidden { display: none; }
        .paper { background: #fff; padding: 20px; border-radius: 10px; margin-top: 15px; text-align: left; }
        .heart-drop { position: absolute; top: -20px; color: #ff4d6d; font-size: 22px; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loader-overlay">
        <div class="progress-wrapper">
            <div class="progress-container">
                <div class="percent-text" id="pct">0%</div>
                <div class="progress-bar" id="pBar">
                    <span class="progress-heart">❤️</span>
                </div>
            </div>
            <div class="loading-label">LOADING</div>
        </div>
    </div>

    <div class="slider-container" id="mainSlider">
        <section class="slide" id="slide1">
            <div class="glass-card" id="card1">
                <div class="emoji-header">🐱 ❤️</div>
                <h2>Sanskriti</h2>
                <h1>Do you love me!?</h1>
                <div class="btn-wrapper">
                    <button id="yesBtn" onclick="processYes()">Yes 💖</button>
                    <button id="noBtn">No 🙈</button>
                </div>
            </div>
        </section>

        <section class="slide">
            <div class="glass-card">
                <h1>You're special! ✨</h1>
                <p>Tumhari hansi meri sabse badi khushi hai. ❤️</p>
                <button onclick="nextSlide(2)" style="background:#ff4d6d;color:white;margin-top:20px">Next ➔</button>
            </div>
        </section>

        <section class="slide">
            <div class="glass-card">
                <h1>A promise... 🌸</h1>
                <p>Main humesha tumhare saath rahunga.</p>
                <button onclick="nextSlide(3)" style="background:#ff4d6d;color:white;margin-top:20px">Read Letter 💌</button>
            </div>
        </section>

        <section class="slide">
            <div id="rainContainer"></div>
            <div class="glass-card">
                <div id="lockSection">
                    <h1>A Private Letter 💌</h1>
                    <p>Type <b>10ml</b> to unlock</p><br>
                    <input type="text" id="passcode" style="padding:10px; border-radius:10px; border:1px solid #ffcad4; margin-bottom:10px; text-align:center;">
                    <button onclick="checkCode()" style="background:#ff4d6d;color:white">Open</button>
                </div>
                <div id="letterContent" class="hidden">
                    <div class="paper">
                        <h3 style="color:#ff4d6d">Dear Sanskriti,</h3>
                        <p>Yahan apna letter likhein...</p>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const slider = document.getElementById('mainSlider');

        async function processYes() {
            // 1. Vanish the card immediately
            document.getElementById('card1').classList.add('vanish-out');
            noBtn.style.display = 'none';

            // 2. Show Loading after vanish start
            setTimeout(async () => {
                document.getElementById('loader-overlay').style.display = 'flex';
                let pBar = document.getElementById('pBar');
                let pctText = document.getElementById('pct');

                const update = (v) => {
                    pBar.style.width = v + "%";
                    pctText.innerText = v + "%";
                };

                // Logic: 1% -> 50% -> Stop 2s -> 90% -> Back to 50% -> Final 90%
                for(let i=1; i<=50; i++) { update(i); await new Promise(r => setTimeout(r, 30)); }
                await new Promise(r => setTimeout(r, 2000));
                for(let i=51; i<=90; i++) { update(i); await new Promise(r => setTimeout(r, 30)); }
                await new Promise(r => setTimeout(r, 500));
                update(50);
                await new Promise(r => setTimeout(r, 800));
                for(let i=51; i<=90; i++) { update(i); await new Promise(r => setTimeout(r, 20)); }

                // 3. Move to next slide
                setTimeout(() => {
                    document.getElementById('loader-overlay').style.display = 'none';
                    nextSlide(1);
                }, 500);
            }, 500);
        }

        function nextSlide(idx) {
            slider.style.transform = `translateX(-${idx * 100}vw)`;
            if(idx > 0) noBtn.style.display = 'none';
            if(idx === 3) startHeartRain();
        }

        // No Button Jumping Logic
        const moveNo = () => {
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 50);
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        };
        noBtn.addEventListener('mouseover', moveNo);
        noBtn.addEventListener('touchstart', moveNo);

        function checkCode() {
            if(document.getElementById('passcode').value === "10ml") {
                document.getElementById('lockSection').classList.add('hidden');
                document.getElementById('letterContent').classList.remove('hidden');
            } else { alert("Hint: 10ml"); }
        }

        function startHeartRain() {
            const container = document.getElementById('rainContainer');
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('heart-drop');
                heart.innerHTML = '💗';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 2 + 2) + 's';
                container.appendChild(heart);
                setTimeout(() => heart.remove(), 4000);
            }, 300);
        }
    </script>
</body>
</html>

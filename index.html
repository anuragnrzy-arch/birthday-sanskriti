<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Love</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family: 'Segoe UI', sans-serif;
  overflow:hidden;
  background:#3b1f1f;
}

/* SLIDER */
.slider{
  display:flex;
  width:400%;
  height:100vh;
  transition:0.6s ease;
}

.page{
  width:100%;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* CARD STYLE */
.card{
  width:300px;
  padding:30px;
  background:#5a2c2c;
  border-radius:25px;
  text-align:center;
  box-shadow:0 0 40px rgba(255,0,100,0.4);
}

/* TEXT */
h2{
  color:#ffdede;
  margin:15px 0;
}

/* BUTTON */
button{
  padding:12px 25px;
  border:none;
  border-radius:25px;
  margin:10px;
  cursor:pointer;
  font-size:16px;
}

.yes{background:#ff4d6d;color:white;}
.no{background:black;color:white;position:absolute;}

/* HEART GLOW */
.heart{
  font-size:40px;
  color:#ff4d6d;
  animation:glow 1s infinite alternate;
}

@keyframes glow{
  from{ text-shadow:0 0 10px red;}
  to{ text-shadow:0 0 30px pink;}
}

/* HEART RAIN */
.rain{
  position:fixed;
  top:-20px;
  font-size:14px;
  animation:fall linear infinite;
}

@keyframes fall{
  to{ transform:translateY(100vh);}
}

/* LETTER */
.letter{
  background:white;
  padding:20px;
  border-radius:10px;
  display:none;
}
</style>
</head>

<body>

<div class="slider" id="slider">

<!-- PAGE 1 -->
<div class="page">
  <div class="card">
    <div class="heart">❤️</div>
    <h2>Do you love me?</h2>
    <button class="yes" onclick="next(1)">Yes ❤️</button>
    <button class="no" id="noBtn">No 😒</button>
  </div>
</div>

<!-- PAGE 2 -->
<div class="page">
  <div class="card">
    <h2>Why do you love me? 😏</h2>
    <button class="yes" onclick="next(2)">Because you're special ❤️</button>
    <button class="yes" onclick="next(2)">Because I miss you 🥺</button>
  </div>
</div>

<!-- PAGE 3 -->
<div class="page">
  <div class="card">
    <h2>Will you stay with me forever? 💞</h2>
    <button class="yes" onclick="next(3)">Yes always ❤️</button>
    <button class="yes" onclick="next(3)">Obviously 😌</button>
  </div>
</div>

<!-- PAGE 4 -->
<div class="page">
  <div class="card">
    <h2>Enter code to open letter 💌</h2>
    <input id="code" placeholder="type 10ml" style="padding:10px;border-radius:10px;border:none;">
    <br><br>
    <button class="yes" onclick="openLetter()">Open</button>

    <div class="letter" id="letter">
      <p>
        From the day I met you, everything changed... ❤️<br><br>
        I don't know what future holds,  
        but I just want you in it 💗
      </p>
    </div>
  </div>
</div>

</div>

<script>
let slide = 0;
const slider = document.getElementById("slider");

/* NEXT PAGE */
function next(n){
  slide = n;
  slider.style.transform = "translateX(-"+(slide*100)+"%)";
}

/* NO BUTTON RUN */
const noBtn = document.getElementById("noBtn");
noBtn.style.left="50%";
noBtn.style.top="65%";
noBtn.style.transform="translate(-50%,-50%)";

noBtn.addEventListener("mouseover",()=>{
  const x = Math.random()*(window.innerWidth-100);
  const y = Math.random()*(window.innerHeight-50);
  noBtn.style.left=x+"px";
  noBtn.style.top=y+"px";
});

/* LETTER OPEN */
function openLetter(){
  const val = document.getElementById("code").value;
  if(val==="10ml"){
    document.getElementById("letter").style.display="block";
  }else{
    alert("Wrong code 😒");
  }
}

/* HEART RAIN */
function heart(){
  const h=document.createElement("div");
  h.classList.add("rain");
  h.innerHTML="💗";
  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=(2+Math.random()*3)+"s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),5000);
}
setInterval(heart,300);
</script>

</body>
</html>

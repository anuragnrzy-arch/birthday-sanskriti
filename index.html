<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Love</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  height:100vh;
  background:#5a2c2c;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  font-family:sans-serif;
}

/* Card */
.card{
  width:280px;
  padding:30px;
  background:#6d3a3a;
  border-radius:25px;
  text-align:center;
  box-shadow:0 0 40px rgba(255,0,80,0.4);
  position:relative;
}

/* Heart */
.heart{
  font-size:40px;
  color:#ff3c5f;
  animation: glow 1s infinite alternate;
}

@keyframes glow{
  from{ text-shadow:0 0 10px red;}
  to{ text-shadow:0 0 25px pink;}
}

/* Text */
h2{
  color:#f5dede;
  margin:15px 0;
}

/* Buttons */
.btn{
  padding:12px 25px;
  border:none;
  border-radius:25px;
  font-size:16px;
  cursor:pointer;
  display:block;
  margin:10px auto;
}

/* Yes button */
.yes{
  background:#ff4d6d;
  color:white;
}

/* No button */
.no{
  background:black;
  color:white;
  position:absolute;
}

/* Rain */
.rain{
  position:fixed;
  top:-20px;
  font-size:14px;
  animation: fall linear infinite;
}

@keyframes fall{
  to{
    transform:translateY(100vh);
  }
}

</style>
</head>

<body>

<div class="card">
  <div class="heart">❤️</div>
  <h2>Do you love me?</h2>

  <!-- YES button -->
  <button class="btn yes" onclick="nextPage()">Yes ❤️</button>

  <!-- NO button (starts below Yes) -->
  <button class="btn no" id="noBtn">No 😒</button>
</div>

<script>
const noBtn = document.getElementById("noBtn");

/* initial position below yes */
noBtn.style.left = "50%";
noBtn.style.top = "65%";
noBtn.style.transform = "translate(-50%, -50%)";

/* move but stay visible */
noBtn.addEventListener("mouseover", move);

function move(){
  const x = Math.random() * (window.innerWidth - 100);
  const y = Math.random() * (window.innerHeight - 50);

  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}

/* next page */
function nextPage(){
  alert("Next page 😏");
}

/* heart rain */
function createHeart(){
  const heart = document.createElement("div");
  heart.classList.add("rain");
  heart.innerHTML = "💗";

  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = (2 + Math.random()*3) + "s";

  document.body.appendChild(heart);

  setTimeout(()=>heart.remove(),5000);
}

setInterval(createHeart,300);
</script>

</body>
</html>}

@keyframes fall{
  to{
    transform:translateY(100vh);
  }
}

</style>
</head>

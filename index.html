<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Sanskriti</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            background-color: #ffcad4;
            overflow: hidden; /* Screen se bahar kuch nahi jayega */
            touch-action: none; /* Mobile zoom/scroll disable */
        }

        .slider-container {
            display: flex;
            width: 400vw;
            height: 100vh;
            transition: transform 0.6s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .slide {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: radial-gradient(circle, #ffdee9 0%, #ffcad4 100%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(255, 105, 135, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            width: 90%;
            max-width: 350px;
            z-index: 10;
        }

        .emoji-header { font-size: 50px; margin-bottom: 10px; }
        h2 { font-weight: 500; color: #444; margin-bottom: 5px; }
        h1 { font-size: 24px; margin-bottom: 30px; color: #222; }

        .btn-wrapper {
            position: relative;
            height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        button {
            padding: 12px 35px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        #yesBtn { background-color: #ff4d6d; color: white; margin-bottom: 20px; }

        #noBtn { 
            background-color: #222; 
            color: #ff4d6d; 
            position: absolute;
            top: 70px; /* Starting position inside your white box area */
            transition: all 0.2s ease;
            z-index: 999;
        }

        .footer-text { font-size: 11px; color: #888; margin-top: 20px; font-style: italic; }

        /* Rain & Letter */
        .hidden { display: none; }
        .paper { background: #fff; padding: 20px; border-radius: 10px; text-align: left; margin-top: 15px; }
        .heart-drop { position: absolute; top: -20px; color: #ff4d6d; font-size: 22px; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
        
        input[type="text"] { padding: 12px; border-radius: 10px; border: 1px solid #ffcad4; width: 80%; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="slider-container" id="mainSlider">
        <section class="slide">
            <div class="glass-card">
                <div class="emoji-header">🐱 ❤️</div>
                <h2>Sanskriti</h2>
                <h1>Do you love me!?</h1>
                <div class="btn-wrapper">
                    <button id="yesBtn" onclick="nextSlide(1)">Yes 💖</button>
                    <button id="noBtn">No 🙈</button>
                </div>
                <p class="footer-text">Some love stories don't allow "no" 🐝</p>
            </div>
        </section>

        <section class="slide"><div class="glass-card"><h1>You're special! ✨</h1><button onclick="nextSlide(2)" style="background:#ff4d6d;color:white;margin-top:20px">Next ➔</button></div></section>
        <section class="slide"><div class="glass-card"><h1>A promise... 🌸</h1><button onclick="nextSlide(3)" style="background:#ff4d6d;color:white;margin-top:20px">Read Letter 💌</button></div></section>

        <section class="slide">
            <div id="rainContainer"></div>
            <div class="glass-card">
                <div id="lockSection">
                    <h1>A Private Letter 💌</h1>
                    <p>Type <b>10ml</b> to unlock</p><br>
                    <input type="text" id="passcode">
                    <button onclick="checkCode()" style="background:#ff4d6d;color:white">Open</button>
                </div>
                <div id="letterContent" class="hidden">
                    <div class="paper">
                        <h3 style="color:#ff4d6d">Dear Sanskriti,</h3>
                        <p>Tum bohot pyaari ho... [Your paragraph here]</p>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const slider = document.getElementById('mainSlider');

        const moveNoButton = (e) => {
            if(e.type === 'touchstart') e.preventDefault();

            // SAARE SIDES SE 60px KA GAP (Button gayab nahi hoga)
            const padding = 60; 
            
            // Available area calculate karo
            const vw = window.innerWidth;
            const vh = window.innerHeight;

            // Nayi random position (Safe boundary ke andar)
            const randomX = Math.floor(Math.random() * (vw - (padding * 2))) + padding;
            const randomY = Math.floor(Math.random() * (vh - (padding * 2))) + padding;

            noBtn.style.position = 'fixed'; // Pure screen ke hisaab se move hoga
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        };

        noBtn.addEventListener('mouseover', moveNoButton);
        noBtn.addEventListener('touchstart', moveNoButton);

        function nextSlide(idx) {
            slider.style.transform = `translateX(-${idx * 100}vw)`;
            if(idx === 3) startHeartRain();
        }

        function checkCode() {
            if(document.getElementById('passcode').value === "10ml") {
                document.getElementById('lockSection').classList.add('hidden');
                document.getElementById('letterContent').classList.remove('hidden');
            } else { alert("Code is 10ml"); }
        }

        function startHeartRain() {
            const container = document.getElementById('rainContainer');
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('heart-drop');
                heart.innerHTML = '💗';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 2 + 2) + 's';
                container.appendChild(heart);
                setTimeout(() => heart.remove(), 4000);
            }, 300);
        }
    </script>
</body>
</html>

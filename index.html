<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Sanskriti</title>
    <style>
        * { 
            margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            user-select: none;
        }
        body { background-color: #fce4ec; overflow: hidden; touch-action: none; }

        /* --- SPOTIFY STYLE SECTION --- */
        .spotify-card {
            width: 100%;
            height: 100%;
            background: #121212; /* Dark Spotify Theme */
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            position: relative;
            color: white;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            color: #b3b3b3;
            cursor: pointer;
            z-index: 100;
        }

        .spotify-photo {
            width: 90%;
            max-width: 300px;
            aspect-ratio: 1/1;
            border-radius: 15px; /* Rounded corners as per pic */
            object-fit: cover;
            margin-top: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .playing-tag {
            position: absolute;
            top: 55px;
            right: 35px;
            background: rgba(0, 0, 0, 0.6);
            color: #1DB954;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 1px;
            border: 1px solid #1DB954;
        }

        .song-details {
            width: 90%;
            margin-top: 25px;
            text-align: left;
        }

        .song-title {
            font-size: 24px;
            font-weight: bold;
            color: white;
            margin-bottom: 5px;
        }

        .artist-name {
            font-size: 16px;
            color: #b3b3b3;
        }

        .progress-container-spotify {
            width: 90%;
            margin-top: 20px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 4px;
            background: #4f4f4f;
            border-radius: 2px;
            position: relative;
        }

        .progress-fill {
            width: 35%; /* Hardcoded progress for UI look */
            height: 100%;
            background: #1DB954;
            border-radius: 2px;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #b3b3b3;
            margin-top: 8px;
        }

        /* --- LYRICS SECTION --- */
        .lyrics-box {
            width: 90%;
            height: 100px;
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            overflow: hidden;
            padding: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            mask-image: linear-gradient(transparent, black 20%, black 80%, transparent);
        }

        #lyrics-scroller {
            transition: transform 0.5s ease;
        }

        .lyric-line {
            font-size: 16px;
            color: #b3b3b3;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .lyric-line.active {
            color: white;
            font-weight: bold;
            transform: scale(1.05);
        }

        /* --- CONTROLS --- */
        .spotify-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
            width: 100%;
        }

        .control-icon {
            font-size: 25px;
            color: white;
            cursor: pointer;
        }

        .play-pause-btn {
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: black;
            font-size: 24px;
        }

        /* --- ALL OTHER ORIGINAL CSS PRESERVED --- */
        #no-message-box { position: fixed; top: -200px; left: 50%; transform: translateX(-50%); z-index: 1000; transition: top 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; flex-direction: column; align-items: center; }
        .string { width: 2px; height: 60px; background: #ff4d6d; margin: 0 45px; position: relative; }
        .hanging-card { background: white; padding: 12px 20px; border-radius: 12px; border: 2px solid #ff4d6d; font-weight: bold; color: #ff4d6d; }
        #master-lock-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fdf2f5; z-index: 20000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .slider-container { display: flex; width: 600vw; height: 100vh; transition: transform 0.8s cubic-bezier(0.65, 0, 0.35, 1); }
        .slide { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #fdf2f5 0%, #fce4ec 100%); }
        input[type="text"] { padding: 12px; border-radius: 10px; border: 1.5px solid #ffcad4; width: 85%; margin-bottom: 15px; text-align: center; }
        .begin-btn { background: #ff4d6d; color: white; padding: 12px 30px; border-radius: 25px; border: none; font-weight: bold; }
    </style>
</head>
<body>

    <div id="master-lock-screen">
        <div class="lock-icon" id="mainLockEmoji">🔒</div>
        <div style="background:white; padding:30px; border-radius:20px; text-align:center; width:80%;">
            <p style="margin-bottom:15px; font-weight:bold;">Type your boyfriend name 😤</p>
            <input type="text" id="bfNameInput" placeholder="Enter name...">
            <button onclick="unlockMaster()" style="background:#ff4d6d; color:white; width:100%; padding:10px; border-radius:10px; border:none;">Unlock</button>
        </div>
    </div>

    <div class="slider-container" id="mainSlider">
        <section class="slide">
            <div style="text-align:center;">
                <h1 style="color: #ff4d6d; margin-bottom:20px;">Do you love me!?</h1>
                <button onclick="nextSlide(1)" style="padding:15px 40px; background:#ff4d6d; color:white; border-radius:25px; border:none;">Yes 👀</button>
            </div>
        </section>

        <section class="slide">
            <div class="spotify-card">
                <div class="close-btn" onclick="nextSlide(0)">✕</div>
                <div class="playing-tag">● PLAYING</div>
                
                <img src="https://i.ibb.co/KpDd1ZF9/1000092801.jpg" class="spotify-photo">

                <div class="song-details">
                    <div class="song-title">10,000 Hours</div>
                    <div class="artist-name">Dan + Shay, Justin Bieber</div>
                </div>

                <div class="progress-container-spotify">
                    <div class="progress-bar-bg"><div class="progress-fill"></div></div>
                    <div class="time-info"><span>0:02</span><span>3:44</span></div>
                </div>

                <div class="lyrics-box">
                    <div id="lyrics-scroller">
                        <div class="lyric-line active">Do you love the rain, does it make you dance</div>
                        <div class="lyric-line">Are you the outdoors or the party type</div>
                        <div class="lyric-line">I wanna know everything about you</div>
                        <div class="lyric-line">I'd spend ten thousand hours</div>
                        <div class="lyric-line">And ten thousand more...</div>
                    </div>
                </div>

                <div class="spotify-controls">
                    <div class="control-icon">⏮</div>
                    <div class="play-pause-btn" onclick="togglePlay()">⏸</div>
                    <div class="control-icon">⏭</div>
                </div>

                <div style="margin-top: 30px;">
                    <input type="text" id="secretCodeInput" placeholder="Enter Code (10ml)..." style="background:#222; color:white; border:none;">
                    <button class="begin-btn" onclick="checkSecretCode()">Begin Journey</button>
                </div>
            </div>
        </section>
    </div>

    <script>
        let isPlaying = true;
        let lyricIndex = 0;
        const lines = document.querySelectorAll('.lyric-line');
        const scroller = document.getElementById('lyrics-scroller');

        // Automatic Lyrics Logic
        setInterval(() => {
            if(isPlaying) {
                lines.forEach(l => l.classList.remove('active'));
                lyricIndex = (lyricIndex + 1) % lines.length;
                lines[lyricIndex].classList.add('active');
                scroller.style.transform = `translateY(-${lyricIndex * 35}px)`;
            }
        }, 3500);

        function togglePlay() {
            isPlaying = !isPlaying;
            document.querySelector('.play-pause-btn').innerText = isPlaying ? "⏸" : "▶";
        }

        function unlockMaster() {
            const name = document.getElementById('bfNameInput').value.trim().toLowerCase();
            if(name === "anurag") {
                document.getElementById('master-lock-screen').style.display = 'none';
            } else {
                alert("Wrong Name! 😤");
            }
        }

        function nextSlide(idx) {
            document.getElementById('mainSlider').style.transform = `translateX(-${idx * 100}vw)`;
        }

        function checkSecretCode() {
            const code = document.getElementById('secretCodeInput').value.trim().toLowerCase();
            if(code === "10ml") {
                alert("Journey Started! ❤️");
            } else {
                alert("Wrong Code !!😤");
            }
        }
    </script>
</body>
</html>

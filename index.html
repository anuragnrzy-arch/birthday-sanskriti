<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Sanskriti</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            background-color: #ffcad4;
            overflow: hidden;
            touch-action: none; 
        }

        .slider-container {
            display: flex;
            width: 400vw;
            height: 100vh;
            transition: transform 0.6s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .slide {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: radial-gradient(circle, #ffdee9 0%, #ffcad4 100%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(255, 105, 135, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            width: 90%;
            max-width: 350px;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        /* --- LOADING SCREEN STYLES --- */
        #loader-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            background: radial-gradient(circle, #ffdee9 0%, #ffcad4 100%);
        }

        .progress-container {
            width: 85%;
            max-width: 320px;
            height: 16px;
            background: #333;
            border-radius: 20px;
            position: relative;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #ff4d6d;
            border-radius: 20px;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); /* Smooth movement */
            position: relative;
        }

        .progress-heart {
            position: absolute;
            right: -10px;
            top: -24px;
            font-size: 20px;
            animation: bounce 0.6s infinite alternate;
        }

        .percent-tag {
            position: absolute;
            right: 0;
            top: -28px;
            font-size: 14px;
            color: #444;
            font-weight: bold;
        }

        .loading-text {
            margin-top: 20px;
            color: #444;
            letter-spacing: 3px;
            font-size: 16px;
            font-weight: bold;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-6px); }
        }

        /* --- UI COMPONENTS --- */
        .emoji-header { font-size: 50px; margin-bottom: 10px; }
        h1 { font-size: 24px; margin-bottom: 30px; color: #222; }

        .btn-wrapper {
            position: relative;
            height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        button {
            padding: 12px 35px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        #yesBtn { background-color: #ff4d6d; color: white; }
        #noBtn { background-color: #222; color: #ff4d6d; position: absolute; top: 75px; z-index: 999; }

        .hidden { display: none; }
        .paper { background: #fff; padding: 20px; border-radius: 10px; text-align: left; margin-top: 15px; }
        .heart-drop { position: absolute; top: -20px; color: #ff4d6d; font-size: 22px; pointer-events: none; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
        input[type="text"] { padding: 12px; border-radius: 10px; border: 1px solid #ffcad4; width: 80%; margin-bottom: 10px; outline: none; text-align: center; }
    </style>
</head>
<body>

    <div id="loader-screen">
        <div class="progress-container">
            <div class="percent-tag" id="percentText">0%</div>
            <div class="progress-bar" id="progressBar">
                <span class="progress-heart">❤️</span>
            </div>
        </div>
        <div class="loading-text">LOADING</div>
    </div>

    <div class="slider-container" id="mainSlider">
        <section class="slide">
            <div class="glass-card" id="firstCard">
                <div class="emoji-header">🐱 ❤️</div>
                <h2>Sanskriti</h2>
                <h1>Do you love me!?</h1>
                <div class="btn-wrapper">
                    <button id="yesBtn" onclick="startLoadingLogic()">Yes 💖</button>
                    <button id="noBtn">No 🙈</button>
                </div>
            </div>
        </section>

        <section class="slide">
            <div class="glass-card">
                <h1>You're special! ✨</h1>
                <p>Tumhari hansi meri sabse badi khushi hai. ❤️</p>
                <button onclick="nextSlide(2)" style="background:#ff4d6d;color:white;margin-top:20px">Next ➔</button>
            </div>
        </section>

        <section class="slide">
            <div class="glass-card">
                <h1>A promise... 🌸</h1>
                <p>Main humesha tumhare saath rahunga.</p>
                <button onclick="nextSlide(3)" style="background:#ff4d6d;color:white;margin-top:20px">Read Letter 💌</button>
            </div>
        </section>

        <section class="slide">
            <div id="rainContainer"></div>
            <div class="glass-card">
                <div id="lockSection">
                    <h1>A Private Letter 💌</h1>
                    <p>Type <b>10ml</b> to unlock</p><br>
                    <input type="text" id="passcode" placeholder="Enter code">
                    <button onclick="checkCode()" style="background:#ff4d6d;color:white">Open</button>
                </div>
                <div id="letterContent" class="hidden">
                    <div class="paper">
                        <h3 style="color:#ff4d6d">Dear Sanskriti,</h3>
                        <p>Yahan apna letter likhein...</p>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const slider = document.getElementById('mainSlider');
        const bar = document.getElementById('progressBar');
        const text = document.getElementById('percentText');

        // No Button Jump Logic
        const moveNoButton = (e) => {
            if(e.type === 'touchstart') e.preventDefault();
            const padding = 50;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;
            let randomX = Math.floor(Math.random() * (maxX - padding)) + padding;
            let randomY = Math.floor(Math.random() * (maxY - padding)) + padding;
            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        };
        noBtn.addEventListener('mouseover', moveNoButton);
        noBtn.addEventListener('touchstart', moveNoButton);

        // --- THE LOADING LOGIC ---
        function startLoadingLogic() {
            document.getElementById('firstCard').style.opacity = '0';
            noBtn.style.display = 'none';

            setTimeout(() => {
                document.getElementById('loader-screen').style.display = 'flex';
                
                // Step 1: Go to 50%
                updateProgress(50);

                // Step 2: Wait 2 seconds at 50%
                setTimeout(() => {
                    // Step 3: Go to 90%
                    updateProgress(90);

                    // Step 4: Go back to 50% after a short delay
                    setTimeout(() => {
                        updateProgress(50);

                        // Step 5: Final jump to 90% and open
                        setTimeout(() => {
                            updateProgress(90);
                            
                            // Step 6: Final transition to next page
                            setTimeout(() => {
                                document.getElementById('loader-screen').style.opacity = '0';
                                setTimeout(() => {
                                    document.getElementById('loader-screen').style.display = 'none';
                                    nextSlide(1);
                                }, 500);
                            }, 1000);
                        }, 800);
                    }, 800);
                }, 2000); 

            }, 400);
        }

        function updateProgress(val) {
            bar.style.width = val + '%';
            text.innerText = val + '%';
        }

        function nextSlide(idx) {
            slider.style.transform = `translateX(-${idx * 100}vw)`;
            if(idx === 3) startHeartRain();
        }

        function checkCode() {
            if(document.getElementById('passcode').value === "10ml") {
                document.getElementById('lockSection').classList.add('hidden');
                document.getElementById('letterContent').classList.remove('hidden');
            } else { alert("Hint: 10ml"); }
        }

        function startHeartRain() {
            const container = document.getElementById('rainContainer');
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('heart-drop');
                heart.innerHTML = '💗';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 2 + 2) + 's';
                container.appendChild(heart);
                setTimeout(() => heart.remove(), 4000);
            }, 300);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Sanskriti</title>
    <style>
        /* Base Styles */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #fce4ec; overflow: hidden; touch-action: none; }
        
        /* Message Box */
        #no-message-box { position: fixed; top: -200px; left: 50%; transform: translateX(-50%); z-index: 1000; transition: top 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; flex-direction: column; align-items: center; }
        .string { width: 2px; height: 60px; background: #ff4d6d; margin: 0 45px; position: relative; }
        .string::before { content: ''; position: absolute; top: -10px; left: -2px; width: 6px; height: 6px; background: #ff4d6d; border-radius: 50%; }
        .strings-container { display: flex; justify-content: center; width: 100%; }
        .hanging-card { background: white; padding: 12px 20px; border-radius: 12px; box-shadow: 0 8px 20px rgba(255, 77, 109, 0.15); border: 2px solid #ff4d6d; font-weight: bold; color: #ff4d6d; font-size: 16px; white-space: nowrap; margin-top: -2px; }

        /* Lock Screen */
        #master-lock-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fdf2f5; z-index: 20000; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: all 0.8s cubic-bezier(0.65, 0, 0.35, 1); }
        .lock-icon { font-size: 80px; margin-bottom: 20px; transition: transform 1s ease; }
        .lock-input-box { background: rgba(255, 240, 245, 0.9); padding: 30px; border-radius: 20px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); text-align: center; width: 85%; max-width: 320px; border: 1px solid rgba(255, 182, 193, 0.5); box-shadow: 0 0 20px rgba(255, 77, 109, 0.3), 0 0 40px rgba(255, 77, 109, 0.1); animation: glowPulse 2s infinite alternate; }

        /* Error Overlay */
        #error-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.2); z-index: 30000; display: none; justify-content: center; align-items: center; }
        .error-popup { background: white; padding: 25px; border-radius: 15px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 280px; border: 2px solid #ff4d6d; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .error-msg { color: #333; font-weight: bold; margin-bottom: 20px; font-size: 16px; line-height: 1.4; }

        /* Slider & Slides */
        .slider-container { display: flex; width: 500vw; height: 100vh; transition: transform 0.8s cubic-bezier(0.65, 0, 0.35, 1); }
        .slide { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #fdf2f5 0%, #fce4ec 100%); }
        .glass-card { background: rgba(255, 245, 247, 0.9); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-radius: 25px; padding: 40px 20px; text-align: center; width: 90%; max-width: 350px; transition: opacity 0.4s ease; box-shadow: 0 8px 32px rgba(255, 182, 193, 0.3); border: 1.5px solid rgba(255, 255, 255, 0.8); }

        /* Envelope Page */
        .page2-container { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; position: relative; }
        .envelope-wrapper { position: relative; width: 280px; height: 180px; background: #ff4d6d; border-radius: 0 0 15px 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); z-index: 5; transform: translateY(-40px); }
        .envelope-wrapper::before { content: ''; position: absolute; top: 0; left: 0; border-left: 140px solid transparent; border-right: 140px solid transparent; border-top: 100px solid #ff758f; transform-origin: top; transition: transform 0.5s ease; z-index: 10; }
        .envelope-wrapper.open::before { transform: rotateX(180deg); z-index: 4; }
        .letter-content { position: absolute; top: 10px; left: 50%; transform: translateX(-50%) translateY(0); width: 260px; height: 160px; background: white; border-radius: 10px; padding: 20px; transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1); z-index: 6; opacity: 0; box-shadow: 0 5px 15px rgba(0,0,0,0.1); overflow: hidden; pointer-events: none; }
        .envelope-wrapper.open .letter-content { opacity: 1; transform: translateX(-50%) translateY(-240px); width: 330px; height: 460px; z-index: 15; pointer-events: auto; transition-delay: 0.6s; }
        .scroll-box-page2 { height: 100%; overflow-y: auto; text-align: left; font-size: 14px; color: #444; line-height: 1.6; padding-right: 5px; }
        .cat-image-sorry { width: 100%; max-width: 180px; display: block; margin: 15px auto 5px auto; border-radius: 10px; }

        /* --- PAGE 3: REVEAL SECTION FIXED --- */
        .reveal-title { font-family: 'Brush Script MT', cursive, sans-serif; color: #ff4d6d; font-size: 32px; margin-bottom: 30px; text-align: center; }
        .main-reveal-box { background: rgba(0, 0, 0, 0.2); padding: 20px; border-radius: 20px; width: 90%; max-width: 320px; display: flex; flex-direction: column; gap: 15px; }
        .rectangle-box { 
            background: rgba(255, 255, 255, 0.1); /* Transparent as requested */
            min-height: 60px; 
            border-radius: 15px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            color: white; 
            font-size: 18px; 
            padding: 10px; 
            text-align: center; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            cursor: pointer; 
            transition: transform 0.2s; 
        }
        .rectangle-box:active { transform: scale(0.98); }
        .see-more-btn { background: #ff4d6d; color: white; padding: 12px 30px; border-radius: 25px; border: none; font-weight: bold; margin-top: 30px; cursor: pointer; box-shadow: 0 0 15px rgba(255, 77, 109, 0.6); }

        /* Loading Overlay */
        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fdf2f5; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 10000; }
        .progress-container { width: 100%; height: 14px; background: #eee; border-radius: 20px; position: relative; margin-top: 10px; }
        .progress-bar { width: 0%; height: 100%; background: #ff4d6d; border-radius: 20px; transition: width 0.2s ease; }
        .pct-text { position: absolute; right: 0; top: -22px; font-size: 13px; font-weight: bold; color: #ff4d6d; }

        /* Buttons & Inputs */
        button { padding: 12px 20px; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; font-size: 15px; transition: 0.3s; }
        input[type="text"] { padding: 12px; border-radius: 10px; border: 1.5px solid #ffcad4; width: 85%; margin-bottom: 15px; text-align: center; outline: none; }
        
        /* Special Slide */
        .special-slide { background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%) !important; flex-direction: column; }
        .special-title { color: white; font-size: 40px; font-weight: bold; }
        
        /* Final Page */
        #final-letter-page { display: none; opacity: 0; transition: opacity 3s ease; background: #fce4ec; width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; z-index: 5000; flex-direction: column; align-items: center; overflow-y: scroll; padding-top: 40px; }
        .white-paper { background: white; width: 90%; max-width: 350px; border-radius: 15px; padding: 25px; margin-bottom: 40px; }
        .memory-photo { width: 200px; height: 280px; background: white; padding: 8px; border: 2px solid #ff4d6d; border-radius: 10px; margin-bottom: 20px; }
        .memory-photo img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Animations */
        @keyframes glowPulse { from { opacity: 0.8; } to { opacity: 1; } }
        .floating-heart { position: absolute; color: rgba(255, 77, 109, 0.4); animation: floatUp linear infinite; pointer-events: none; }
        @keyframes floatUp { to { transform: translateY(-110vh) rotate(360deg); opacity: 0; } }
    </style>
</head>
<body>
    <div id="no-message-box">
        <div class="strings-container"><div class="string"></div><div class="string"></div></div>
        <div class="hanging-card">You can't say 'NO' 😁😋</div>
    </div>

    <div id="error-overlay">
        <div class="error-popup">
            <div style="font-size: 40px; margin-bottom: 10px;">⚠️</div>
            <div class="error-msg" id="error-text-content">System Error:</div>
            <button onclick="hideError()" style="background: #ff4d6d; color: white; width: 100%;">Try Again</button>
        </div>
    </div>

    <div id="master-lock-screen">
        <div class="lock-icon" id="mainLockEmoji">🔒</div>
        <div class="lock-input-box" id="lockBox">
            <p style="margin-bottom:15px; font-weight:bold; color:#444;">Type your boyfriend name 😤</p>
            <input type="text" id="bfNameInput" placeholder="Enter name...">
            <button onclick="unlockMaster()" style="background:#ff4d6d; color:white; width:100%;">Unlock</button>
        </div>
    </div>

    <div id="loading-overlay">
        <div class="loader-card">
            <div style="position:relative"><span class="pct-text" id="loadPercent">0%</span><div class="progress-container"><div class="progress-bar" id="loadBar"></div></div></div>
            <div style="margin-top:20px; font-weight:bold; color:#ff4d6d;">LOADING...</div>
        </div>
    </div>

    <div id="final-letter-page">
        <div id="bg-heart-container"></div>
        <h1 style="color:#ff4d6d">💗 ᴍʏ ʟᴏᴍʟ 💗</h1>
        <div class="white-paper">
            <div class="scroll-text">
                No matter what happens, I'll always be here for you. ❤️
            </div>
        </div>
        <div class="memory-photo"><img src="https://i.ibb.co/PshjNc3G/IMG-20241006-085454-0002.jpg"></div>
    </div>

    <div class="slider-container" id="mainSlider">
        <section class="slide">
            <div class="glass-card" id="loveCard">
                <div style="font-size:50px">🐱 ❤️</div>
                <h2 style="color: #ff4d6d;">Sanskriti</h2>
                <h1>Do you love me!?</h1>
                <div style="position:relative; height:150px; display:flex; justify-content:center; align-items:center;">
                    <button id="yesBtn" onclick="triggerLoading()" style="background:#ff4d6d; color:white;">Yes 👀</button>
                    <button id="noBtn" style="background:#444; color:white; position:absolute;">No 😒</button>
                </div>
                <p class="footer-text">Some love stories don't allow "no" 😤</p>
            </div>
        </section>

        <section class="slide">
            <div class="page2-container">
                <div class="envelope-wrapper" id="envelopeBox">
                    <div class="letter-content"><div class="scroll-box-page2">I’m truly sorry...🤞🏻✨🍀<img src="https://i.ibb.co/KpDd1ZF9/1000092801.jpg" class="cat-image-sorry"></div></div>
                </div>
                <div style="display:flex; gap:10px; margin-top:20px;">
                    <button id="openBtn" onclick="handleEnvelope()" style="background:white; border:2px solid #ff4d6d; color:#ff4d6d;">Open 💌</button>
                    <button onclick="nextSlide(2)" style="background:#007bff; color:white;">Next ➔</button>
                </div>
            </div>
        </section>

        <section class="slide">
            <div class="page2-container">
                <h1 class="reveal-title">Tap each one to reveal</h1>
                <div class="main-reveal-box">
                    <div class="rectangle-box" onclick="revealText(this, 'You’re my kind of calm.')">♡</div>
                    <div class="rectangle-box" onclick="revealText(this, 'And suddenly, all the love songs were about you.')">♡</div>
                    <div class="rectangle-box" onclick="revealText(this, 'Somehow, it’s always you.')">♡</div>
                </div>
                <button class="see-more-btn" onclick="nextSlide(3)">See more —></button>
            </div>
        </section>

        <section class="slide special-slide" id="something-special-page">
            <h1 class="special-title">ꜱᴏᴍᴇᴛʜɪɴɢ ꜱᴘᴇᴄɪᴀʟ</h1>
            <input type="text" id="secretCodeInput" placeholder="Enter Code...">
            <button onclick="checkSecretCode()" style="background:#ff4d6d; color:white;">Click to Begin</button>
        </section>
    </div>

    <script>
        // FIXED REVEAL FUNCTION: No background color change
        function revealText(element, text) {
            element.innerText = text;
            element.style.fontSize = "16px";
            element.style.fontWeight = "bold";
            // Background is not changed, keeping it as it is in the 2nd pic
        }

        const slider = document.getElementById('mainSlider');
        const bar = document.getElementById('loadBar');
        const pct = document.getElementById('loadPercent');
        const overlay = document.getElementById('loading-overlay');
        const noBtn = document.getElementById('noBtn');

        function handleEnvelope() {
            const env = document.getElementById('envelopeBox');
            env.classList.toggle('open');
            document.getElementById('openBtn').innerText = env.classList.contains('open') ? "Close ✖" : "Open 💌";
        }

        function unlockMaster() {
            const name = document.getElementById('bfNameInput').value.trim().toLowerCase();
            if(name === "anurag") {
                document.getElementById('master-lock-screen').style.display = 'none';
            } else {
                alert("Wrong Name! 😤");
            }
        }

        async function triggerLoading() {
            overlay.style.display = 'flex';
            for(let i=0; i<=100; i++) {
                bar.style.width = i + "%";
                pct.innerText = i + "%";
                await new Promise(r => setTimeout(r, 30));
            }
            nextSlide(1);
            overlay.style.display = 'none';
        }

        function nextSlide(idx) {
            slider.style.transform = `translateX(-${idx * 100}vw)`;
            if(idx === 3) startHearts('heart-container');
        }

        function checkSecretCode() {
            if(document.getElementById('secretCodeInput').value.toLowerCase() === "10ml") {
                document.getElementById('final-letter-page').style.display = 'flex';
                document.getElementById('final-letter-page').style.opacity = '1';
                document.body.style.overflowY = "auto";
            }
        }

        function startHearts(id) {
            setInterval(() => {
                const h = document.createElement('div');
                h.classList.add('floating-heart');
                h.innerHTML = '❤️';
                h.style.left = Math.random() * 100 + "vw";
                h.style.animationDuration = (Math.random() * 3 + 2) + "s";
                document.body.appendChild(h);
                setTimeout(() => h.remove(), 5000);
            }, 400);
        }

        noBtn.addEventListener('mouseover', () => {
            noBtn.style.left = Math.random() * 80 + "vw";
            noBtn.style.top = Math.random() * 80 + "vh";
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Sanskriti</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            background-color: #fce4ec; 
            overflow: hidden;
            touch-action: none; 
        }

        /* NO BUTTON MESSAGE BOX */
        #no-message-box {
            position: fixed;
            top: -200px; 
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            transition: top 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .string {
            width: 2px;
            height: 60px;
            background: #ff4d6d;
            margin: 0 45px;
            position: relative;
        }

        .hanging-card {
            background: white;
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(255, 77, 109, 0.15);
            border: 2px solid #ff4d6d;
            font-weight: bold;
            color: #ff4d6d;
            font-size: 16px;
            white-space: nowrap;
            margin-top: -2px;
        }

        /* MASTER ENTRY LOCK SCREEN */
        #master-lock-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #fdf2f5;
            z-index: 20000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.8s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .lock-input-box {
            background: rgba(255, 240, 245, 0.9);
            padding: 30px; border-radius: 20px;
            text-align: center; width: 85%; max-width: 320px;
            border: 1px solid rgba(255, 182, 193, 0.5);
            box-shadow: 0 0 20px rgba(255, 77, 109, 0.3);
        }

        /* SLIDER & CARDS */
        .slider-container {
            display: flex; width: 500vw; height: 100vh;
            transition: transform 0.8s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .slide {
            width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: radial-gradient(circle, #fdf2f5 0%, #fce4ec 100%);
        }

        .glass-card {
            background: rgba(255, 245, 247, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 25px; padding: 40px 20px;
            text-align: center; width: 90%; max-width: 350px;
            box-shadow: 0 8px 32px rgba(255, 182, 193, 0.3);
        }

        /* LETTER PAGE */
        #final-letter-page {
            display: none; opacity: 0;
            transition: opacity 3s ease;
            background: #fce4ec;
            width: 100vw; height: 100vh;
            position: fixed; top: 0; left: 0;
            z-index: 5000;
            flex-direction: column;
            align-items: center;
            overflow-y: scroll;
            padding-top: 40px;
        }

        .white-paper {
            background: white; width: 90%; max-width: 350px;
            border-radius: 15px; padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-bottom: 40px;
        }

        /* MEMORIES PHOTO BOXES */
        .memories-container { width: 100%; display: flex; flex-direction: column; align-items: center; }
        
        .memories-grid {
            width: 90%; max-width: 400px;
            display: flex; flex-direction: column;
            gap: 50px; padding-bottom: 100px;
        }

        .memory-box {
            width: 180px; height: 240px;
            background: #fff;
            border: 5px solid #ff4d6d;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(255, 77, 109, 0.3);
        }

        .memory-box img {
            width: 100%; height: 100%;
            object-fit: cover; /* Photo box mein sahi se fit hogi */
        }

        .box-1 { align-self: flex-start; transform: rotate(-8deg); }
        .box-2 { align-self: flex-end; transform: rotate(8deg); }
        .box-3 { align-self: flex-start; transform: rotate(-5deg); }

        /* BUTTONS */
        button { padding: 12px 35px; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; }
        #yesBtn { background-color: #ff4d6d; color: white; }
        #noBtn { background-color: #444; color: #fff; position: absolute; }
        
        .special-slide { background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%) !important; flex-direction: column; }
    </style>
</head>
<body>

    <div id="master-lock-screen">
        <div class="lock-input-box">
            <p style="margin-bottom:15px; font-weight:bold;">Type your boyfriend name 😤</p>
            <input type="text" id="bfNameInput" style="padding:10px; margin-bottom:15px; width:80%;">
            <button onclick="unlockMaster()" style="background:#ff4d6d; color:white; width:100%;">Unlock</button>
        </div>
    </div>

    <div class="slider-container" id="mainSlider">
        <section class="slide">
            <div class="glass-card">
                <h1 style="color: #ff4d6d;">Do you love me!?</h1>
                <div style="height:100px; position:relative; margin-top:20px;">
                    <button id="yesBtn" onclick="nextSlide(1)">Yes 👀</button>
                    <button id="noBtn">No 😒</button>
                </div>
            </div>
        </section>

        <section class="slide">
            <div class="glass-card">
                <h1>You're special! ✨</h1>
                <button onclick="nextSlide(2)" style="background:#ff4d6d;color:white;margin-top:20px">Next ➔</button>
            </div>
        </section>

        <section class="slide special-slide">
            <h1 style="color:white; font-size:30px;">Enter Secret Code</h1>
            <input type="text" id="secretCodeInput" placeholder="Code..." style="padding:10px; margin:20px;">
            <button onclick="checkCode()" style="background:white; color:#ff4d6d;">Open Letter 💌</button>
        </section>
    </div>

    <div id="final-letter-page">
        <div class="white-paper">
            <h2 style="color:#ff4d6d">My Letter ❤️</h2>
            <p style="margin-top:15px; color:#555; line-height:1.6;">
                To my special one... Main humesha tumhare saath rahunga. No matter what happens, you are important to me.
            </p>
        </div>

        <div class="memories-container">
            <h3 style="color:#ff4d6d; margin-bottom:30px;">OUR MEMORIES 💝</h3>
            <div class="memories-grid">
                <div class="memory-box box-1">
                    <img src="https://i.ibb.co/67vS0X9b/mask-selfie.jpg" alt="Memory 1">
                </div>
                <div class="memory-box box-2">
                    <img src="https://i.ibb.co/3mS00Ppt/saree-suit.jpg" alt="Memory 2">
                </div>
                <div class="memory-box box-3">
                    <img src="https://i.ibb.co/N6vS0X9b/bus-selfie.jpg" alt="Memory 3">
                </div>
            </div>
        </div>
    </div>

    <script>
        function unlockMaster() {
            const name = document.getElementById('bfNameInput').value.toLowerCase();
            if(name === "anurag") {
                document.getElementById('master-lock-screen').style.display = 'none';
            } else { alert("Wrong Name! 😤"); }
        }

        function nextSlide(idx) {
            document.getElementById('mainSlider').style.transform = `translateX(-${idx * 100}vw)`;
        }

        function checkCode() {
            const code = document.getElementById('secretCodeInput').value;
            if(code === "10ml") {
                document.getElementById('mainSlider').style.display = 'none';
                document.getElementById('final-letter-page').style.display = 'flex';
                setTimeout(() => { document.getElementById('final-letter-page').style.opacity = '1'; }, 50);
                document.body.style.overflowY = "auto";
            } else { alert("Wrong Code! 😤"); }
        }

        const noBtn = document.getElementById('noBtn');
        noBtn.addEventListener('mouseover', () => {
            noBtn.style.left = Math.random() * 80 + '%';
            noBtn.style.top = Math.random() * 80 + '%';
        });
    </script>
</body>
</html>

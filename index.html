<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Sanskriti</title>
    <style>
        * { 
            margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            user-select: none;
        }
        body { background-color: #fce4ec; overflow: hidden; touch-action: none; }
        
        /* Spotify Player Specific Styling */
        .spotify-container {
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #2c3e50, #000000);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            position: relative;
            color: white;
        }

        .close-spotify {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 24px;
            color: rgba(255,255,255,0.7);
            cursor: pointer;
            z-index: 100;
        }

        .album-art {
            width: 220px;
            height: 220px;
            border-radius: 50%; /* Same to same circle */
            margin-top: 50px;
            border: 4px solid #1DB954;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            object-fit: cover;
            animation: rotateArt 10s linear infinite;
            animation-play-state: paused;
        }

        @keyframes rotateArt {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .song-info {
            text-align: center;
            margin-top: 20px;
            width: 100%;
        }

        .song-name { font-size: 22px; font-weight: bold; margin-bottom: 5px; color: #fff; }
        .artist-name { font-size: 14px; color: #1DB954; font-weight: 500; }

        .lyrics-window {
            margin-top: 30px;
            height: 150px;
            overflow: hidden;
            width: 90%;
            mask-image: linear-gradient(transparent, black 20%, black 80%, transparent);
            -webkit-mask-image: linear-gradient(transparent, black 20%, black 80%, transparent);
            text-align: center;
        }

        #lyrics-content {
            transition: transform 0.5s ease;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .lyric-line {
            font-size: 18px;
            font-weight: bold;
            color: rgba(255,255,255,0.4);
            transition: 0.3s;
        }

        .lyric-line.active {
            color: #fff;
            transform: scale(1.1);
        }

        .controls {
            margin-top: 40px;
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .play-btn {
            width: 65px;
            height: 65px;
            background: #1DB954;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;
            color: black;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(29, 185, 84, 0.3);
        }

        /* Rest of the original CSS preserved */
        #no-message-box { position: fixed; top: -200px; left: 50%; transform: translateX(-50%); z-index: 1000; transition: top 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; flex-direction: column; align-items: center; }
        .string { width: 2px; height: 60px; background: #ff4d6d; margin: 0 45px; position: relative; }
        .hanging-card { background: white; padding: 12px 20px; border-radius: 12px; border: 2px solid #ff4d6d; font-weight: bold; color: #ff4d6d; }
        #master-lock-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fdf2f5; z-index: 20000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .slider-container { display: flex; width: 600vw; height: 100vh; transition: transform 0.8s cubic-bezier(0.65, 0, 0.35, 1); }
        .slide { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #fdf2f5 0%, #fce4ec 100%); }
        .special-slide { background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%) !important; flex-direction: column; }
        input[type="text"] { padding: 12px; border-radius: 10px; border: 1.5px solid #ffcad4; width: 85%; margin-bottom: 15px; outline: none; text-align: center; }
        .begin-btn { background: #ff4d6d !important; color: white !important; padding: 15px 45px; border-radius: 35px; font-weight: bold; border: none; }
    </style>
</head>
<body>

    <div id="master-lock-screen">
        <div style="font-size: 80px;" id="mainLockEmoji">🔒</div>
        <div style="background: white; padding: 30px; border-radius: 20px; text-align: center;">
            <p style="margin-bottom:15px; font-weight:bold;">Type your boyfriend name 😤</p>
            <input type="text" id="bfNameInput" placeholder="Enter name...">
            <button onclick="unlockMaster()" style="background:#ff4d6d; color:white; width:100%; padding:10px; border-radius:10px; border:none;">Unlock</button>
        </div>
    </div>

    <div class="slider-container" id="mainSlider">
        <section class="slide">
            <div style="text-align:center;">
                <div style="font-size:50px">🐱 ❤️</div>
                <h1 style="color: #ff4d6d;">Do you love me!?</h1>
                <button id="yesBtn" onclick="nextSlide(1)" style="padding:15px 40px; background:#ff4d6d; color:white; border-radius:25px; border:none; margin-top:20px;">Yes 👀</button>
            </div>
        </section>

        <section class="slide special-slide" id="something-special-page">
            <div class="spotify-container">
                <div class="close-spotify" onclick="location.reload()">✖</div>
                
                <img src="https://i.ibb.co/KpDd1ZF9/1000092801.jpg" class="album-art" id="player-art">
                
                <div class="song-info">
                    <div class="song-name">Tu Itni Khoobsurat Hai</div>
                    <div class="artist-name">Special For You ❤️</div>
                </div>

                <div class="lyrics-window">
                    <div id="lyrics-content">
                        <div class="lyric-line active">Lafzon se jo tha pare</div>
                        <div class="lyric-line">Tu woh sadiyon ka geet hai</div>
                        <div class="lyric-line">Tu itni khoobsurat hai</div>
                        <div class="lyric-line">Fida didar pe tere</div>
                        <div class="lyric-line">Mukammal ishq hota hai</div>
                        <div class="lyric-line">Tere aagosh mein aake...</div>
                    </div>
                </div>

                <div class="controls">
                    <div class="play-btn" onclick="togglePlay()" id="playIcon">▶</div>
                </div>
                
                <div style="margin-top: 20px;">
                    <input type="text" id="secretCodeInput" placeholder="Enter Code (10ml)...">
                    <button class="begin-btn" onclick="checkSecretCode()">Unlock Final</button>
                </div>
            </div>
        </section>
    </div>

    <script>
        let isPlaying = false;
        let lyricIndex = 0;
        const lyrics = document.querySelectorAll('.lyric-line');
        const lyricBox = document.getElementById('lyrics-content');
        let lyricInterval;

        function togglePlay() {
            const btn = document.getElementById('playIcon');
            const art = document.getElementById('player-art');
            
            if(!isPlaying) {
                btn.innerText = "⏸";
                art.style.animationPlayState = 'running';
                startLyrics();
            } else {
                btn.innerText = "▶";
                art.style.animationPlayState = 'paused';
                clearInterval(lyricInterval);
            }
            isPlaying = !isPlaying;
        }

        function startLyrics() {
            lyricInterval = setInterval(() => {
                lyrics.forEach(l => l.classList.remove('active'));
                lyricIndex = (lyricIndex + 1) % lyrics.length;
                lyrics[lyricIndex].classList.add('active');
                
                // Lyrics scroll effect
                lyricBox.style.transform = `translateY(-${lyricIndex * 35}px)`;
            }, 3000); // Change lyric every 3 seconds
        }

        function unlockMaster() {
            const name = document.getElementById('bfNameInput').value.trim().toLowerCase();
            if(name === "anurag") {
                document.getElementById('master-lock-screen').style.display = 'none';
            } else {
                alert("Wrong Name! 😤");
            }
        }

        function nextSlide(idx) {
            document.getElementById('mainSlider').style.transform = `translateX(-${idx * 100}vw)`;
        }

        function checkSecretCode() {
            const code = document.getElementById('secretCodeInput').value.trim().toLowerCase();
            if(code === "10ml") {
                alert("Opening Final Letter... ❤️");
                // Yahan aap apna final letter function call kar sakte ho
            } else {
                alert("Wrong Code !!😤");
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You ❤️</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    text-align: center;
    background: linear-gradient(135deg, #ffd6e0, #d6ecff);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    padding: 20px;
    max-width: 300px;
}

img {
    width: 160px;
    margin-bottom: 10px;
}

h2 {
    color: #333;
    font-size: 22px;
}

p {
    color: #555;
    font-size: 14px;
}

button {
    padding: 10px 18px;
    margin-top: 15px;
    border: none;
    border-radius: 10px;
    background: white;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    font-size: 16px;
}
</style>
</head>

<body>

<div class="container">

    <!-- 🐱 START GIF -->
    <img id="gif" src="https://media.tenor.com/qjX6dC4qKpUAAAAi/cute-cat.gif">

    <h2 id="title">Hey… 🥺</h2>
    <p id="text">I want to tell you something...</p>

    <button onclick="next()">Next ➡️</button>

</div>

<script>

let page = 0;

function next(){
    page++;

    // 💔 Slide 1 (Breakup)
    if(page == 1){
        document.getElementById("gif").src =
        "https://media.tenor.com/tw4eQy6cGvMAAAAi/cute-cry.gif";

        document.getElementById("title").innerText =
        "We broke up… 💔";

        document.getElementById("text").innerText =
        "That time was really hard for me… I missed you every single day.";
    }

    // 💖 Slide 2 (Back together)
    else if(page == 2){
        document.getElementById("gif").src =
        "https://media.tenor.com/qjX6dC4qKpUAAAAi/cute-cat.gif";

        document.getElementById("title").innerText =
        "But we found our way again… 💖";

        document.getElementById("text").innerText =
        "After 1 year… we are back. And it feels more special than ever.";
    }

    // 💫 Slide 3 (May 9 special)
    else if(page == 3){
        document.getElementById("gif").src =
        "https://media.tenor.com/2roX3uxz_68AAAAi/cat-love.gif";

        document.getElementById("title").innerText =
        "May 9 💫";

        document.getElementById("text").innerText =
        "The day we met… the most special day of my life. I love you ❤️";

        document.querySelector("button").innerText = "❤️";
    }
}

</script>

</body>
</html>

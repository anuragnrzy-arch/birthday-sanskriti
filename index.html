<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Sanskriti</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            background-color: #ffcad4;
            overflow: hidden;
            touch-action: none; 
        }

        /* LOADING SCREEN - Full Screen Overlay */
        #loader-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle, #ffdee9 0%, #ffcad4 100%);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .progress-wrapper {
            width: 80%;
            max-width: 400px;
            text-align: center;
        }

        .progress-container {
            width: 100%;
            height: 14px;
            background: rgba(0,0,0,0.1);
            border-radius: 20px;
            position: relative;
            margin-bottom: 10px;
            overflow: visible; /* Heart bahar dikhne ke liye */
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #ff4d6d;
            border-radius: 20px;
            position: relative;
            transition: width 0.3s ease;
        }

        .progress-heart {
            position: absolute;
            right: -12px;
            top: -25px;
            font-size: 20px;
        }

        .percent-text {
            position: absolute;
            right: 0;
            top: 20px;
            font-weight: bold;
            color: #444;
        }

        .loading-label {
            margin-top: 30px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #ff4d6d;
        }

        /* SLIDER LOGIC */
        .slider-container {
            display: flex;
            width: 400vw;
            height: 100vh;
            transition: transform 0.6s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .slide {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(255, 105, 135, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            width: 90%;
            max-width: 350px;
            z-index: 10;
        }

        .emoji-header { font-size: 50px; margin-bottom: 10px; }
        h1 { font-size: 24px; margin-bottom: 30px; color: #222; }
        
        .btn-wrapper { position: relative; height: 150px; display: flex; flex-direction: column; align-items: center; }
        
        button {
            padding: 12px 35px; border: none; border-radius: 25px;
            cursor: pointer; font-weight: bold; font-size: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        #yesBtn { background-color: #ff4d6d; color: white; }
        #noBtn { background-color: #222; color: #ff4d6d; position: absolute; top: 75px; transition: 0.1s; z-index: 999; }

        .hidden { display: none; }
        .paper { background: #fff; padding: 20px; border-radius: 10px; text-align: left; margin-top: 15px; }
        .heart-drop { position: absolute; top: -20px; color: #ff4d6d; font-size: 22px; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loader-screen">
        <div class="progress-wrapper">
            <div class="progress-container">
                <div class="progress-bar" id="progressBar">
                    <span class="progress-heart">❤️</span>
                </div>
                <div class="percent-text" id="percentNum">0%</div>
            </div>
            <div class="loading-label">LOADING...</div>
        </div>
    </div>

    <div class="slider-container" id="mainSlider">
        <section class="slide" id="firstSlide">
            <div class="glass-card">
                <div class="emoji-header">🐱 ❤️</div>
                <h2>Sanskriti</h2>
                <h1>Do you love me!?</h1>
                <div class="btn-wrapper">
                    <button id="yesBtn" onclick="runLoader()">Yes 💖</button>
                    <button id="noBtn">No 🙈</button>
                </div>
            </div>
        </section>

        <section class="slide">
            <div class="glass-card">
                <h1>You're special! ✨</h1>
                <p>Tumhari hansi meri sabse badi khushi hai. ❤️</p>
                <button onclick="nextSlide(2)" style="background:#ff4d6d;color:white;margin-top:20px">Next ➔</button>
            </div>
        </section>

        <section class="slide">
            <div class="glass-card">
                <h1>A promise... 🌸</h1>
                <p>Main humesha tumhare saath rahunga.</p>
                <button onclick="nextSlide(3)" style="background:#ff4d6d;color:white;margin-top:20px">Read Letter 💌</button>
            </div>
        </section>

        <section class="slide">
            <div id="rainContainer"></div>
            <div class="glass-card">
                <div id="lockSection">
                    <h1>A Private Letter 💌</h1>
                    <p>Type <b>10ml</b> to unlock</p><br>
                    <input type="text" id="passcode" placeholder="Enter code" style="padding:10px; border-radius:10px; border:1px solid #ddd; width:80%">
                    <button onclick="checkCode()" style="background:#ff4d6d;color:white; margin-top:10px">Open</button>
                </div>
                <div id="letterContent" class="hidden">
                    <div class="paper">
                        <h3 style="color:#ff4d6d">Dear Sanskriti,</h3>
                        <p>Yahan apna letter likhein...</p>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const slider = document.getElementById('mainSlider');
        const loader = document.getElementById('loader-screen');
        const bar = document.getElementById('progressBar');
        const pText = document.getElementById('percentNum');

        // Loader Function
        async function runLoader() {
            // 1. First slide vanish karo aur loader dikhao
            document.getElementById('firstSlide').style.opacity = "0";
            loader.style.display = "flex";

            // 2. 1% se 50% tak loading
            for(let i=1; i<=50; i++) {
                bar.style.width = i + "%";
                pText.innerText = i + "%";
                await new Promise(r => setTimeout(r, 40));
            }

            // 3. Pause for 2 seconds
            await new Promise(r => setTimeout(r, 2000));

            // 4. 50% se 90% tak
            for(let i=51; i<=90; i++) {
                bar.style.width = i + "%";
                pText.innerText = i + "%";
                await new Promise(r => setTimeout(r, 50));
            }

            // 5. Wapas 50% par aana
            await new Promise(r => setTimeout(r, 500));
            bar.style.width = "50%";
            pText.innerText = "50%";

            // 6. Wapas 90% par aake open hona
            await new Promise(r => setTimeout(r, 800));
            for(let i=51; i<=90; i++) {
                bar.style.width = i + "%";
                pText.innerText = i + "%";
                await new Promise(r => setTimeout(r, 30));
            }

            // Final: Loader hide karo aur direct 2nd slide par slide karo
            await new Promise(r => setTimeout(r, 500));
            loader.style.display = "none";
            nextSlide(1); 
        }

            slider.style.transform = `translateX(-${idx * 100}vw)`;

        }

            noBtn.style.top = (Math.random() * maxY + 25) + 'px';
        };

        noBtn.addEventListener('mouseover', moveNoButton);
        noBtn.addEventListener('touchstart', moveNoButton);

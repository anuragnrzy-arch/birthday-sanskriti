<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Sanskriti</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            background-color: #fce4ec; 
            overflow: hidden;
            touch-action: none; 
        }

        /* NO BUTTON MESSAGE BOX (Hanging Style) */
        #no-message-box {
            position: fixed;
            top: -200px; 
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            transition: top 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .string {
            width: 2px;
            height: 60px;
            background: #ff4d6d;
            margin: 0 45px;
            position: relative;
        }
        
        .string::before {
            content: '';
            position: absolute;
            top: -10px; left: -2px;
            width: 6px; height: 6px;
            background: #ff4d6d; border-radius: 50%;
        }

        .strings-container { display: flex; justify-content: center; width: 100%; }

        .hanging-card {
            background: white;
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(255, 77, 109, 0.15);
            border: 2px solid #ff4d6d;
            font-weight: bold;
            color: #ff4d6d;
            font-size: 16px;
            white-space: nowrap;
            margin-top: -2px;
        }

        /* MASTER ENTRY LOCK SCREEN */
        #master-lock-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #fdf2f5;
            z-index: 20000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.8s cubic-bezier(0.65, 0, 0.35, 1);
        }

        #error-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.2);
            z-index: 30000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .error-popup {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 280px;
            border: 2px solid #ff4d6d;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .error-msg { color: #333; font-weight: bold; margin-bottom: 20px; font-size: 16px; line-height: 1.4; }

        .lock-icon { font-size: 80px; margin-bottom: 20px; transition: transform 1s ease; }
        
        .lock-input-box {
            background: rgba(255, 240, 245, 0.9);
            padding: 30px; border-radius: 20px;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            text-align: center; width: 85%; max-width: 320px;
            border: 1px solid rgba(255, 182, 193, 0.5);
            box-shadow: 0 0 20px rgba(255, 77, 109, 0.3), 0 0 40px rgba(255, 77, 109, 0.1);
            animation: glowPulse 2s infinite alternate;
        }

        @keyframes glowPulse {
            from { box-shadow: 0 0 15px rgba(255, 77, 109, 0.2), 0 0 30px rgba(255, 77, 109, 0.1); }
            to { box-shadow: 0 0 30px rgba(255, 77, 109, 0.5), 0 0 50px rgba(255, 77, 109, 0.3); }
        }

        .slider-container {
            display: flex; width: 500vw; height: 100vh;
            transition: transform 0.8s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .slide {
            width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: radial-gradient(circle, #fdf2f5 0%, #fce4ec 100%);
        }

        .glass-card {
            background: rgba(255, 245, 247, 0.9);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-radius: 25px; padding: 40px 20px;
            text-align: center; width: 90%; max-width: 350px;
            transition: opacity 0.4s ease;
            box-shadow: 0 8px 32px rgba(255, 182, 193, 0.3);
            border: 1.5px solid rgba(255, 255, 255, 0.8);
        }

        /* --- PAGE 2: ENVELOPE SYSTEM (REFIXED) --- */
        .page2-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .envelope-wrapper {
            position: relative;
            width: 280px;
            height: 180px;
            background: #ff4d6d;
            border-radius: 0 0 15px 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            z-index: 5;
            transition: transform 0.5s ease;
            transform: translateY(50px);
        }

        /* Flap */
        .envelope-wrapper::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            border-left: 140px solid transparent;
            border-right: 140px solid transparent;
            border-top: 100px solid #ff758f;
            transform-origin: top;
            transition: transform 0.4s ease-in;
            z-index: 10; /* Pocket ke upar */
        }

        .envelope-wrapper.open::before {
            transform: rotateX(180deg);
            z-index: 4; /* Khulne ke baad letter ke peeche */
        }

        /* Letter Initial State (Inside Envelope) */
        .letter-content {
            position: absolute;
            bottom: 10px; /* Envelope ke andar chupa hua */
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            height: 150px;
            background: white;
            border-radius: 10px;
            padding: 20px;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease, height 0.8s, width 0.8s;
            z-index: 6; /* Flap ke peeche par envelope base ke upar */
            opacity: 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            pointer-events: none;
        }

        /* Letter Animation (0.5s delay after flap opens) */
        .envelope-wrapper.open .letter-content {
            opacity: 1;
            transform: translateX(-50%) translateY(-320px); /* Upar nikalna */
            height: 440px;
            width: 330px;
            z-index: 15;
            pointer-events: auto;
            transition-delay: 0.5s; /* 0.50 sec wait before coming out */
        }

        .scroll-box-page2 {
            height: 100%;
            overflow-y: auto;
            text-align: left;
            font-size: 14px;
            color: #444;
            line-height: 1.6;
            padding-right: 5px;
        }

        .scroll-box-page2::-webkit-scrollbar { width: 3px; }
        .scroll-box-page2::-webkit-scrollbar-thumb { background: #ff4d6d; }

        .action-btns-page2 {
            position: absolute;
            bottom: 80px; 
            display: flex;
            gap: 15px; 
            z-index: 25;
        }

        #openBtn { background: white; color: #ff4d6d; width: 140px; border: 2px solid #ff4d6d; }
        #nextBtn2 { background: #007bff; color: white; width: 140px; }

        /* --- REST OF THE CODE --- */

        #loading-overlay {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: #fdf2f5;
            display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10000;
        }

        .loader-card {
            width: 85%; max-width: 320px; padding: 40px 20px;
            background: rgba(255, 245, 247, 0.9);
            border-radius: 25px; text-align: center;
        }

        .progress-container { width: 100%; height: 14px; background: #eee; border-radius: 20px; position: relative; margin-top: 10px; }
        .progress-bar { width: 0%; height: 100%; background: #ff4d6d; border-radius: 20px; transition: width 0.2s ease; }
        .pct-text { position: absolute; right: 0; top: -22px; font-size: 13px; font-weight: bold; color: #ff4d6d; }

        .btn-wrapper { position: relative; height: 150px; display: flex; flex-direction: column; align-items: center; }
        button { padding: 12px 20px; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; font-size: 15px; transition: 0.3s; }
        #yesBtn { background-color: #ff4d6d; color: white; }
        #noBtn { background-color: #444; color: #fff; position: absolute; top: 70px; z-index: 999; }
        
        .footer-text { font-size: 11px; color: #a38b91; margin-top: 25px; font-style: italic; }

        input[type="text"] { 
            padding: 12px; border-radius: 10px; border: 1.5px solid #ffcad4; 
            width: 85%; margin-bottom: 15px; text-align: center;
        }

        #something-special-page { transition: opacity 1.5s ease; }
        .special-slide { background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%) !important; flex-direction: column; position: relative; overflow: hidden; }
        .special-title { color: white; font-size: 40px; font-weight: bold; margin-bottom: 5px; z-index: 10; }
        .special-subtitle { color: white; font-size: 22px; font-style: italic; margin-bottom: 40px; opacity: 0.9; z-index: 10; }
        .begin-btn { background: #ff4d6d !important; color: white !important; padding: 15px 45px; border-radius: 35px; font-size: 18px; font-weight: bold; z-index: 10; }

        .floating-heart { position: absolute; bottom: -50px; color: rgba(255, 77, 109, 0.4); font-size: 20px; animation: floatUp linear infinite; z-index: 1; pointer-events: none; }
        @keyframes floatUp { to { transform: translateY(-110vh) rotate(360deg); opacity: 0; } }

        #final-letter-page { display: none; opacity: 0; transition: opacity 3s ease; background: #fce4ec; width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; z-index: 5000; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 40px; overflow-y: scroll; }
        #bg-heart-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

        .white-paper { background: white; width: 90%; max-width: 350px; border-radius: 15px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 40px; z-index: 10; }
        .scroll-text { color: #555; font-size: 15px; line-height: 1.6; text-align: left; }

        .memories-container { width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 10; }
        .memory-photo { width: 200px; height: 280px; background: white; padding: 8px; border: 2px solid #ff4d6d; border-radius: 10px; margin-bottom: 20px; }
        .memory-photo img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <div id="no-message-box">
        <div class="strings-container"><div class="string"></div><div class="string"></div></div>
        <div class="hanging-card">You can't say 'NO' 😁😋</div>
    </div>

    <div id="error-overlay">
        <div class="error-popup">
            <div class="error-msg" id="error-text-content">System Error:</div>
            <button onclick="hideError()" style="background: #ff4d6d; color: white; width: 100%;">Try Again</button>
        </div>
    </div>

    <div id="master-lock-screen">
        <div class="lock-icon" id="mainLockEmoji">🔒</div>
        <div class="lock-input-box" id="lockBox">
            <p style="margin-bottom:15px; font-weight:bold;">Type your boyfriend name 😤</p>
            <input type="text" id="bfNameInput" placeholder="Enter name...">
            <button onclick="unlockMaster()" style="background:#ff4d6d; color:white; width:100%;">Unlock</button>
        </div>
    </div>

    <div id="loading-overlay">
        <div class="loader-card">
            <span class="pct-text" id="loadPercent">0%</span>
            <div class="progress-container"><div class="progress-bar" id="loadBar"></div></div>
            <div style="margin-top:20px; font-weight:bold; color:#ff4d6d;">LOADING...</div>
        </div>
    </div>

    <div id="final-letter-page">
        <div id="bg-heart-container"></div>
        <div class="white-paper">
            <div class="scroll-text"><strong>To my special one</strong><br><br>I'll always be here for you. ❤️</div>
        </div>
        <div class="memories-container">
            <div class="memory-photo"><img src="https://i.ibb.co/PshjNc3G/IMG-20241006-085454-0002.jpg"></div>
        </div>
    </div>

    <div class="slider-container" id="mainSlider">
        <section class="slide">
            <div class="glass-card" id="loveCard">
                <h1 style="margin-bottom:30px; color: #444;">Do you love me!?</h1>
                <div class="btn-wrapper">
                    <button id="yesBtn" onclick="triggerLoading()">Yes 👀</button>
                    <button id="noBtn">No 😒</button>
                </div>
            </div>
        </section>

        <section class="slide">
            <div class="page2-container">
                <div class="envelope-wrapper" id="envelopeBox">
                    <div class="letter-content">
                        <div class="scroll-box-page2">
                            <strong style="font-size: 18px; color: #ff4d6d;">My Sona, ❤️</strong><br><br>
                            I understand where I went wrong and I’m working on becoming a better version of myself... 🤞🏻✨🍀
                        </div>
                    </div>
                </div>
                <div class="action-btns-page2">
                    <button id="openBtn" onclick="handleEnvelope()">Open 💌</button>
                    <button id="nextBtn2" onclick="nextSlide(2)">Next ➔</button>
                </div>
            </div>
        </section>

        <section class="slide">
            <div class="glass-card">
                <h1>A promise... 🌸</h1>
                <button onclick="nextSlide(3)" style="background:#ff4d6d;color:white;margin-top:20px">Read Letter 💌</button>
            </div>
        </section>

        <section class="slide special-slide" id="something-special-page">
            <div id="heart-container"></div>
            <h1 class="special-title">ꜱᴏᴍᴇᴛʜɪɴɢ ꜱᴘᴇᴄɪᴀʟ</h1>
            <input type="text" id="secretCodeInput" placeholder="Enter Code...">
            <button class="begin-btn" onclick="checkSecretCode()">Click to Begin</button>
        </section>
    </div>

    <script>
        const slider = document.getElementById('mainSlider');
        const bar = document.getElementById('loadBar');
        const pct = document.getElementById('loadPercent');
        const overlay = document.getElementById('loading-overlay');
        const errorOverlay = document.getElementById('error-overlay');
        const errorText = document.getElementById('error-text-content');
        const noBtn = document.getElementById('noBtn');
        const noMsgBox = document.getElementById('no-message-box');

        function handleEnvelope() {
            const env = document.getElementById('envelopeBox');
            const btn = document.getElementById('openBtn');
            if(env.classList.contains('open')) {
                env.classList.remove('open');
                btn.innerText = "Open 💌";
            } else {
                env.classList.add('open');
                btn.innerText = "Close ✖";
            }
        }

        function unlockMaster() {
            const name = document.getElementById('bfNameInput').value.trim().toLowerCase();
            if(name === "anurag") {
                document.getElementById('mainLockEmoji').innerText = "🔓";
                setTimeout(() => { document.getElementById('master-lock-screen').style.display = 'none'; }, 1000);
            } else {
                errorText.innerHTML = "WHO IS HE!?? 🤨🤨😤";
                errorOverlay.style.display = 'flex';
            }
        }

        function hideError() { errorOverlay.style.display = 'none'; }

        function checkSecretCode() {
            if(document.getElementById('secretCodeInput').value.trim().toLowerCase() === "10ml") revealLetter();
            else { errorText.innerHTML = "Wrong Code !!😤"; errorOverlay.style.display = 'flex'; }
        }

        async function triggerLoading() {
            noMsgBox.style.top = '-200px'; 
            overlay.style.display = 'flex';
            for(let i=1; i<=100; i++) { 
                bar.style.width = i + "%"; pct.innerText = i + "%"; 
                await new Promise(r => setTimeout(r, 20)); 
            }
            nextSlide(1);
            overlay.style.display = 'none';
        }

        function nextSlide(idx) {
            slider.style.transform = `translateX(-${idx * 100}vw)`;
            if(idx === 3) startHearts('heart-container');
        }

        function startHearts(id) {
            setInterval(() => {
                const h = document.createElement('div'); h.classList.add('floating-heart'); h.innerHTML = '❤️';
                h.style.left = Math.random() * 100 + 'vw'; document.getElementById(id).appendChild(h);
                setTimeout(() => h.remove(), 5000);
            }, 400);
        }

        function revealLetter() {
            document.getElementById('something-special-page').style.opacity = '0';
            setTimeout(() => {
                slider.style.display = 'none';
                document.getElementById('final-letter-page').style.display = 'flex';
                document.getElementById('final-letter-page').style.opacity = '1';
                document.body.style.overflowY = "auto";
            }, 1000);
        }

        const moveNoButton = (e) => {
            noMsgBox.style.top = '0px'; 
            noBtn.style.position = 'fixed';
            noBtn.style.left = Math.random() * 80 + 'vw';
            noBtn.style.top = Math.random() * 80 + 'vh';
        };
        noBtn.addEventListener('mouseover', moveNoButton);
        noBtn.addEventListener('touchstart', moveNoButton);
    </script>
</body>
</html>

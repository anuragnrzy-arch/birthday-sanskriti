<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Love Page</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg,#f8d7da,#eac1c1);
    font-family: Arial;
    text-align: center;
}

.container {
    animation: fadeIn 1s ease;
}

@keyframes fadeIn {
    from {opacity:0; transform:scale(0.8);}
    to {opacity:1; transform:scale(1);}
}

img {
    width: 140px;
    margin-bottom: 10px;
}

button {
    padding: 10px 18px;
    margin: 10px;
    border: none;
    border-radius: 10px;
    background: white;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

#noBtn {
    position: absolute;
}
</style>
</head>

<body>

<div class="container">
    <img id="gif" src="https://i.imgur.com/1Q9Z1Zm.gif">
    <h2 id="text">Do you love me? 🥺</h2>
    <p id="sub">Chiku is all yours</p>

    <button onclick="yes()">Yes</button>
    <button id="noBtn" onclick="no()">No</button>
</div>

<script>

let step = 0;

function yes(){
    document.getElementById("gif").src =
    "https://i.imgur.com/4M7IWwP.gif";

    document.getElementById("text").innerText =
    "I knew it! You Love me 😘";

    document.getElementById("sub").innerText = "";
}

function no(){
    step++;

    if(step == 1){
        document.getElementById("gif").src =
        "https://i.imgur.com/oXgFQ4B.gif";

        document.getElementById("text").innerText =
        "Please think again 🥺";
    }

    else if(step == 2){
        document.getElementById("gif").src =
        "https://i.imgur.com/8Km9tLL.gif";

        document.getElementById("text").innerText =
        "Baby maan jao na 😭";
    }

    move();
}

function move(){
    let btn = document.getElementById("noBtn");

    let x = Math.random() * (window.innerWidth - 100);
    let y = Math.random() * (window.innerHeight - 50);

    btn.style.left = x + "px";
    btn.style.top = y + "px";
}

</script>

</body>
</html>
